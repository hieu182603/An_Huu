      properties:
        requestId: *a1
      required:
        - requestId
  required:
    - data
    - meta
CancelledEnvelope:
  type: object
  additionalProperties: false
  properties:
    data:
      $ref: "#/CancelledResult"
    meta:
      type: object
      additionalProperties: false
      properties:
        requestId: *a1
