    - meta
SavedProductsEnvelope:
  type: object
  additionalProperties: false
  properties:
    data:
      type: array
      items:
        $ref: "#/SavedProduct"
    meta:
      type: object
      additionalProperties: false
      properties:
        requestId: *a1
      required:
        - requestId
  required:
    - data
    - meta
DepositEnvelope:
  type: object
  additionalProperties: false
  properties:
    data:
      $ref: "#/DepositResult"
    meta:
      type: object
      additionalProperties: false
      properties:
        requestId: *a1
      required:
        - requestId
  required:
    - data
    - meta
BondEnvelope:
  type: object
  additionalProperties: false
  properties:
    data:
      $ref: "#/BondResult"
    meta:
      type: object
      additionalProperties: false
      properties:
        requestId: *a1
      required:
        - requestId
  required:
    - data
    - meta
ProtectionEnvelope:
  type: object
  additionalProperties: false
  properties:
    data:
      $ref: "#/ProtectionResult"
    meta:
      type: object
      additionalProperties: false
