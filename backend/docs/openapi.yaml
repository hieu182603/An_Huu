  /api/v1/auth/change-password:
    post:
      operationId: changeCurrentPassword
      summary: Change password and revoke all sessions
      tags:
        - Secondary features
      security:
        - bearerAuth: []
      description: Checks the current password, revokes refresh families, increments
        security version and clears the refresh cookie. Subsequent requests
        require login.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      changed:
                        type: boolean
                        enum:
                          - true
                    required:
                      - changed
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      requestId:
                        type: string
                        format: uuid
                    required:
                      - requestId
                required:
                  - data
                  - meta
        default:
          description: 400 validation; 401 session; 403 permission; 404 not
            found/ownership; 409 revision conflict; 429 rate limit; 503
            database/media unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 200
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
                  description: At most 72 UTF-8 bytes; must differ from currentPassword.
              required:
                - currentPassword
                - password
