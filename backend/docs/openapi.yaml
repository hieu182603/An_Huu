components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
        - requestId
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        requestId:
          type: string
          format: uuid
    HealthEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - alive
                - ready
        meta:
          type: object
          additionalProperties: false
          required:
            - requestId
          properties:
            requestId:
              type: string
              format: uuid
    Money:
      type: string
      pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
      example: "12000000.00"
      description: VND Decimal(18,2). Money is a decimal string.
    Role:
      type: string
      enum:
        - USER
        - ADMIN
      description: Frontend adapter maps USER to user and ADMIN to admin; UI role is
        not authorization.
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO-8601. Monthly periods use Asia/Ho_Chi_Minh.
    LegacyHealth:
      type: object
      required:
        - status
        - service
        - timestamp
        - uptime
      properties:
        status:
          type: string
          enum:
            - healthy
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
    LegacyApiHealth:
      type: object
      required:
        - status
        - version
        - realtime
        - environment
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        realtime:
          type: string
        environment:
          type: string
    PublicUser:
      type: object
      additionalProperties: false
      properties:
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum:
            - ACTIVE
            - PENDING_VERIFICATION
            - SUSPENDED
        phone:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        revision:
          type: integer
          minimum: 0
      required:
        - id
        - email
        - fullName
        - role
        - status
        - phone
        - city
        - avatarUrl
        - revision
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          description: Optional Vietnamese mobile number; spaces, parentheses and hyphens
            are removed before validation.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At most 72 UTF-8 bytes; whitespace is preserved.
        fullName:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - email
        - password
        - fullName
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At most 72 UTF-8 bytes; whitespace is preserved.
        remember:
          type: boolean
          default: false
      required:
        - email
        - password
    EmailInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - email
    VerifyInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        otp:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - email
        - otp
    ResetInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[a-zA-Z0-9_-]{43}$
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At most 72 UTF-8 bytes; whitespace is preserved.
      required:
        - token
        - password
    EmptyInput:
      type: object
      additionalProperties: false
      properties: {}
    Personal:
      type: object
      additionalProperties: false
      properties:
        age:
          type: integer
          minimum: 18
          maximum: 110
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
            - UNDISCLOSED
        maritalStatus:
          type: string
          enum:
            - SINGLE
            - MARRIED
            - OTHER
        dependents:
          type: integer
          minimum: 0
          maximum: 30
        city:
          type: string
          maxLength: 120
      required:
        - age
        - gender
        - maritalStatus
        - dependents
        - city
    Income:
      type: object
      additionalProperties: false
      properties:
        primaryIncome:
          $ref: "#/components/schemas/Money"
        secondaryIncome:
          $ref: "#/components/schemas/Money"
      required:
        - primaryIncome
        - secondaryIncome
    Expenses:
      type: object
      additionalProperties: false
      properties:
        essentialExpense:
          $ref: "#/components/schemas/Money"
        lifestyleExpense:
          $ref: "#/components/schemas/Money"
      required:
        - essentialExpense
        - lifestyleExpense
    Assets:
      type: object
      additionalProperties: false
      properties:
        cashSavings:
          $ref: "#/components/schemas/Money"
        realEstateValue:
          $ref: "#/components/schemas/Money"
        liquidAssets:
          $ref: "#/components/schemas/Money"
        stockFundValue:
          $ref: "#/components/schemas/Money"
      required:
        - cashSavings
        - realEstateValue
        - liquidAssets
        - stockFundValue
    Debt:
      type: object
      additionalProperties: false
      properties:
        hasDebt:
          type: boolean
        mortgageDebt:
          $ref: "#/components/schemas/Money"
        consumerDebt:
          $ref: "#/components/schemas/Money"
        monthlyDebtService:
          $ref: "#/components/schemas/Money"
      required:
        - hasDebt
        - mortgageDebt
        - consumerDebt
        - monthlyDebtService
    SocialSecurity:
      type: object
      additionalProperties: false
      properties:
        socialInsuranceYears:
          type: number
          minimum: 0
          maximum: 110
        socialInsuranceSalary:
          $ref: "#/components/schemas/Money"
      required:
        - socialInsuranceYears
        - socialInsuranceSalary
    FinancialData:
      oneOf:
        - $ref: "#/components/schemas/FinancialDataV1"
        - $ref: "#/components/schemas/FinancialDataV2"
