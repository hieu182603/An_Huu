openapi: 3.0.3
info:
  title: An Hưu Backend API
  version: 0.4.0
  description: Auth, accounts, financial profiles, onboarding, content, bookmarks,
    support, consultation requests, notifications and admin operations. Money
    uses VND decimal strings. No client-supplied benchmark rates. Secondary
    routes require community migration 202610030004. New routes have not been
    contract-tested in this coding session.
servers:
  - url: http://localhost:5000
paths:
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        "200":
          description: Healthy response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "403":
          description: Origin rejected
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
