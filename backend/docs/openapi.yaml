openapi: 3.0.3
info:
  title: An Hưu Backend API
  version: 0.1.0
  description: B00 foundation. Business endpoints use /api/v1. Legacy health is
    liveness only.
servers:
  - url: http://localhost:5000
paths:
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        "200":
          description: Healthy response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "403":
          description: Origin rejected
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        "200":
          description: Healthy response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "403":
          description: Origin rejected
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Dependency failed, timeout or draining
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /health:
    get:
      operationId: legacyHealth
      security: []
      responses:
        "200":
          description: Healthy response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyHealth"
        "403":
          description: Origin rejected
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/health:
    get:
      operationId: legacyApiHealth
      security: []
      responses:
        "200":
          description: Healthy response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyApiHealth"
        "403":
          description: Origin rejected
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
        - requestId
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        requestId:
          type: string
          format: uuid
    HealthEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - alive
                - ready
        meta:
          type: object
          additionalProperties: false
          required:
            - requestId
          properties:
            requestId:
              type: string
              format: uuid
    Money:
      type: string
      pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
      example: "12000000.00"
      description: VND Decimal(18,2). Money is a decimal string.
    Role:
      type: string
      enum:
        - USER
        - ADMIN
      description: Frontend adapter maps USER to user and ADMIN to admin; UI role is
        not authorization.
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO-8601. Monthly periods use Asia/Ho_Chi_Minh.
    LegacyHealth:
      type: object
      required:
        - status
        - service
        - timestamp
        - uptime
      properties:
        status:
          type: string
          enum:
            - healthy
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
    LegacyApiHealth:
      type: object
      required:
        - status
        - version
        - realtime
        - environment
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        realtime:
          type: string
        environment:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
