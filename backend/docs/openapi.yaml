  /api/v1/auth/login:
    post:
      operationId: login
      description: Refresh token is only in an HttpOnly cookie. remember=true persists
        it; otherwise it is a session cookie with a server-side 24-hour limit.
        Access token stays in browser memory. Invalid credentials return 401. A
        correct password for a pending account returns 403 EMAIL_NOT_VERIFIED
        without issuing a session. Wrong passwords never disclose the email
        verification state.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: UNAUTHENTICATED — invalid credentials; no session is issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: EMAIL_NOT_VERIFIED — correct password but email verification is
            pending; no session is issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Revision/idempotency conflict; reload or retry
          content:
            application/json:
              schema:
