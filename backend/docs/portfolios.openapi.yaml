  description: schemaVersion 1 uses month-indexed schedules with coverageMonths;
    schemaVersion 2 uses glide paths anchored on the plan retirement month
    (linear by whole years remaining, zero-year point held after retirement) and
    requires Input.retirementMonth. Draft policy requiring a published/effective
    T03 assumption version. Approval validates six dimensions, complete score
    bands, unique IDs, 100% nonnegative weights, continuous indexed schedules,
    covered asset horizons and all three approved annual scenarios. No policy
    defaults. Thresholds, allocations and scenario changes require ADMIN review.
