Document:
  oneOf:
    - type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        title:
          type: string
          minLength: 3
          maxLength: 200
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        effectiveFrom:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
        assumptionVersionId:
          type: string
          format: uuid
        source:
          type: object
          additionalProperties: false
          properties:
            title:
              type: string
              minLength: 3
              maxLength: 2000
            url:
              type: string
              format: uri
              maxLength: 2000
            release:
              type: string
              minLength: 3
              maxLength: 2000
            reviewedOn:
              type: string
              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          required:
            - title
            - url
            - release
            - reviewedOn
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,39}$
              dimension:
                type: string
                enum: &a1
                  - OBJECTIVE
                  - HORIZON
                  - LIQUIDITY
                  - LOSS_TOLERANCE
                  - EXPERIENCE
                  - FINANCIAL_CAPACITY
              prompt:
                type: string
                minLength: 3
                maxLength: 2000
              choices:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      pattern: ^[A-Z][A-Z0-9_]{0,39}$
                    label:
                      type: string
                      minLength: 3
                      maxLength: 2000
                    score:
                      type: integer
                      minimum: 0
                      maximum: 100
                  required:
                    - id
                    - label
                    - score
                minItems: 2
                maxItems: 10
            required:
              - id
              - dimension
              - prompt
              - choices
          maxItems: 30
        riskBands:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,39}$
              label:
                type: string
                minLength: 3
                maxLength: 2000
              minScore:
                type: integer
                minimum: 0
                maximum: 3000
              maxScore:
                type: integer
                minimum: 0
                maximum: 3000
            required:
              - id
              - label
              - minScore
              - maxScore
          maxItems: 20
        templates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,39}$
              label:
                type: string
                minLength: 3
                maxLength: 2000
              coverageMonths:
                type: integer
                minimum: 1
                maximum: 1200
              rebalance:
                type: object
                additionalProperties: false
                properties:
                  everyMonths:
                    anyOf:
                      - type: integer
                        enum:
                          - 1
                      - type: integer
                        enum:
                          - 3
                      - type: integer
                        enum:
                          - 6
                      - type: integer
                        enum:
                          - 12
                  timing:
                    type: string
                    enum:
                      - START_OF_MONTH
                  turnoverCostPercent:
                    type: string
                    pattern: ^(0|[1-9]\d?|100)(\.\d{1,8})?$
                  costConvention:
                    type: string
                    enum:
                      - HALF_L1_TURNOVER_TIMES_COST
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - everyMonths
                  - timing
                  - turnoverCostPercent
                  - costConvention
                  - evidence
              schedule:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    fromIndex:
                      type: integer
                      minimum: 1
                      maximum: 1200
                    toIndex:
                      type: integer
                      minimum: 1
                      maximum: 1200
                    allocations:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          assetClass:
                            type: string
                            pattern: ^[A-Z][A-Z0-9_]{0,39}$
                          weightPercent:
                            type: string
                            pattern: ^(0|[1-9]\d?|100)(\.\d{1,8})?$
                        required:
                          - assetClass
                          - weightPercent
                      minItems: 1
                      maxItems: 20
                  required:
                    - fromIndex
                    - toIndex
                    - allocations
                maxItems: 120
            required:
              - id
              - label
              - coverageMonths
              - rebalance
              - schedule
          maxItems: 30
        rules:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,39}$
              templateId:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,39}$
              riskBandIds:
                type: array
                items:
                  type: string
                  pattern: ^[A-Z][A-Z0-9_]{0,39}$
                minItems: 1
                maxItems: 20
              explanation:
                type: string
                minLength: 3
                maxLength: 2000
              horizon:
                type: object
                additionalProperties: false
                properties:
                  min:
                    type: integer
                    minimum: 1
                    maximum: 1200
                  max:
                    type: integer
                    minimum: 1
                    maximum: 1200
                required:
                  - min
                  - max
              liquidityNeed:
                type: object
                additionalProperties: false
                properties:
                  min:
                    type: integer
                    minimum: 0
                    maximum: 1200
                  max:
                    type: integer
                    minimum: 0
                    maximum: 1200
                required:
                  - min
                  - max
              dimensions:
                type: object
                additionalProperties: false
                properties:
                  OBJECTIVE:
                    type: object
                    additionalProperties: false
                    properties:
                      min:
                        type: integer
                        minimum: 0
                        maximum: 3000
                      max:
                        type: integer
                        minimum: 0
                        maximum: 3000
                    required:
                      - min
                      - max
                  HORIZON:
                    type: object
                    additionalProperties: false
                    properties:
                      min:
                        type: integer
                        minimum: 0
                        maximum: 3000
                      max:
                        type: integer
                        minimum: 0
                        maximum: 3000
                    required:
                      - min
                      - max
                  LIQUIDITY:
                    type: object
                    additionalProperties: false
                    properties:
                      min:
                        type: integer
                        minimum: 0
                        maximum: 3000
                      max:
                        type: integer
                        minimum: 0
                        maximum: 3000
                    required:
                      - min
                      - max
                  LOSS_TOLERANCE:
                    type: object
                    additionalProperties: false
                    properties:
                      min:
                        type: integer
                        minimum: 0
                        maximum: 3000
                      max:
                        type: integer
                        minimum: 0
                        maximum: 3000
                    required:
                      - min
                      - max
                  EXPERIENCE:
                    type: object
                    additionalProperties: false
                    properties:
                      min:
                        type: integer
                        minimum: 0
                        maximum: 3000
                      max:
                        type: integer
                        minimum: 0
                        maximum: 3000
                    required:
                      - min
                      - max
                  FINANCIAL_CAPACITY:
                    type: object
                    additionalProperties: false
                    properties:
                      min:
                        type: integer
                        minimum: 0
                        maximum: 3000
                      max:
                        type: integer
                        minimum: 0
                        maximum: 3000
                    required:
                      - min
                      - max
                required:
                  - OBJECTIVE
                  - HORIZON
                  - LIQUIDITY
                  - LOSS_TOLERANCE
                  - EXPERIENCE
                  - FINANCIAL_CAPACITY
            required:
              - id
              - templateId
              - riskBandIds
              - explanation
              - horizon
              - liquidityNeed
              - dimensions
          maxItems: 100
        scenarios:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: &a2
                  - BASE
                  - ADVERSE
                  - FAVORABLE
              label:
                type: string
                minLength: 3
                maxLength: 2000
              evidence:
                type: string
                minLength: 3
                maxLength: 2000
              convention:
                type: string
                enum:
                  - DELTA_POINTS_ON_NET_NOMINAL_ANNUAL_RATES
              years: &a8
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    year:
                      type: integer
                      minimum: 1900
                      maximum: 2199
                    inflationDeltaPoints:
                      type: string
                      pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                    returns:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          assetClass:
                            type: string
                            pattern: ^[A-Z][A-Z0-9_]{0,39}$
                          deltaPoints:
                            type: string
                            pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                        required:
                          - assetClass
                          - deltaPoints
                      maxItems: 20
                  required:
                    - year
                    - inflationDeltaPoints
                    - returns
                maxItems: 300
            required:
              - kind
              - label
              - evidence
              - convention
              - years
          maxItems: 3
      required:
        - schemaVersion
        - title
        - reason
        - effectiveFrom
        - assumptionVersionId
        - source
        - questions
        - riskBands
        - templates
        - rules
        - scenarios
