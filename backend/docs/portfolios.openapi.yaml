    - assumptionHash
    - answerBasis
    - assessment
    - limitations
    - priceBasis
    - timing
    - status
    - issues
    - scenarios
  description: Read-only unit-portfolio scenarios, no personal
    contributions/withdrawals, plan application or trades. Initial allocation
    cost is not modeled. Rebalancing trades use declared half-L1 turnover cost;
    allocation drifts between scheduled events. Scenario deltas apply after T03
    net nominal conversion. Missing answers do not become zero scores.
