                          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                      required:
                        - offsetMonths
                        - assetClass
                        - shockPercent
                        - spreadPoints
                    PROPERTY_ILLIQUIDITY:
                      type: object
                      additionalProperties: false
                      properties:
                        offsetMonths:
                          type: integer
                          minimum: -1200
                          maximum: 1200
                        durationMonths:
                          type: integer
                          minimum: 1
                          maximum: 1200
                        delayMonths:
                          type: integer
                          minimum: 1
                          maximum: 120
                        haircutPercent:
                          type: string
                          maxLength: 30
                          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                      required:
                        - offsetMonths
                        - durationMonths
                        - delayMonths
                        - haircutPercent
                    INCOME_LOSS:
                      type: object
                      additionalProperties: false
                      properties:
                        offsetMonths:
                          type: integer
                          minimum: -1200
                          maximum: 1200
                        durationMonths:
                          type: integer
                          minimum: 1
                          maximum: 1200
                        lostPercent:
                          type: string
                          maxLength: 30
                          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                      required:
                        - offsetMonths
                        - durationMonths
                        - lostPercent
                    LONGEVITY:
                      type: object
                      additionalProperties: false
                      properties:
                        extraYears:
                          type: array
                          items:
                            anyOf:
                              - type: integer
                                enum:
                                  - 5
                              - type: integer
                                enum:
                                  - 10
                          minItems: 1
                          maxItems: 2
                      required:
                        - extraYears
              required:
                - evidence
          required:
            - schemaVersion
            - title
            - reason
            - effectiveFrom
            - assumptionVersionId
            - source
            - questions
            - riskBands
            - templates
            - rules
            - scenarios
  required:
    - expectedRevision
    - data
