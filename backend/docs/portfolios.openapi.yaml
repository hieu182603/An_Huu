Approve:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    reviewNote:
      type: string
      minLength: 3
      maxLength: 2000
    confirm:
      type: boolean
      enum:
        - true
  required:
    - expectedRevision
    - reviewNote
    - confirm
Publish:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    confirm:
      type: boolean
      enum:
        - true
  required:
    - expectedRevision
    - confirm
Input:
  type: object
  additionalProperties: false
  properties:
    policyVersionId:
      type: string
      format: uuid
    startMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    horizonMonths:
      type: integer
      minimum: 1
      maximum: 1200
    liquidityNeedMonths:
      type: integer
      minimum: 0
      maximum: 1200
    templateId:
      type: string
      pattern: ^[A-Z][A-Z0-9_]{0,39}$
    answers:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          questionId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          choiceId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
        required:
          - questionId
          - choiceId
      maxItems: 30
  required:
    - policyVersionId
    - startMonth
    - horizonMonths
    - liquidityNeedMonths
    - answers
Approval:
  type: object
  additionalProperties: false
  properties:
    actor: &a3
      type: string
      format: uuid
    approvedAt: &a5
      type: string
      format: date-time
    reviewNote:
      type: string
    documentHash:
      type: string
    assumptionHash:
      type: string
  required:
    - actor
    - approvedAt
    - reviewNote
    - documentHash
    - assumptionHash
Version:
  type: object
  additionalProperties: false
  properties:
    id: *a3
    version: &a4
      type: integer
    revision: *a4
    status:
      type: string
      enum:
        - DRAFT
        - APPROVED
        - PUBLISHED
    data:
      $ref: "#/Document"
    documentHash:
      type: string
    approval:
      anyOf:
        - $ref: "#/Approval"
        - type: object
          nullable: true
          enum:
            - null
    createdBy: *a3
    publishedBy:
      type: string
      format: uuid
      nullable: true
    createdAt: *a5
    effectiveAt:
      type: string
      format: date-time
      nullable: true
  required:
    - id
    - version
    - revision
    - status
    - data
    - documentHash
    - approval
    - createdBy
    - publishedBy
    - createdAt
    - effectiveAt
List:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - AVAILABLE
        - UNCONFIGURED
    total: *a4
    page: *a4
    limit: *a4
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id: *a3
          version: *a4
          revision: *a4
          status:
            type: string
            enum:
              - DRAFT
              - APPROVED
              - PUBLISHED
          title:
            type: string
          effectiveAt:
            type: string
            format: date-time
            nullable: true
        required:
          - id
          - version
          - revision
          - status
          - title
          - effectiveAt
  required:
    - status
    - total
    - page
    - limit
    - items
Issue:
  type: object
  additionalProperties: false
  properties:
    path:
      type: string
    code:
      type: string
  required:
    - path
    - code
Validation:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - VALID
        - INCOMPLETE
    issues:
      type: array
      items:
        $ref: "#/Issue"
  required:
    - status
    - issues
Assessment:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - INCOMPLETE
        - MATCHED
    issues:
      type: array
      items:
        $ref: "#/Issue"
    totalScore:
      type: integer
      nullable: true
    dimensionScores:
      type: object
      additionalProperties: false
      properties:
        OBJECTIVE:
          type: integer
          nullable: true
        HORIZON:
          type: integer
          nullable: true
        LIQUIDITY:
          type: integer
          nullable: true
        LOSS_TOLERANCE:
          type: integer
          nullable: true
        EXPERIENCE:
          type: integer
          nullable: true
        FINANCIAL_CAPACITY:
          type: integer
          nullable: true
      required:
        - OBJECTIVE
        - HORIZON
        - LIQUIDITY
        - LOSS_TOLERANCE
        - EXPERIENCE
        - FINANCIAL_CAPACITY
    riskBandId:
      type: string
      nullable: true
    selectedTemplateId:
      type: string
      nullable: true
    eligibleTemplateIds:
      type: array
      items:
        type: string
    answers:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          questionId:
            type: string
          dimension:
            type: string
          choiceId:
            type: string
