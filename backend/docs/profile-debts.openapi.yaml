                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: object
                          additionalProperties: false
                          properties:
                            contractVersion:
                              type: integer
                              enum:
                                - 1
                            source:
                              type: string
                              minLength: 1
                              maxLength: 300
                            confirmedOn:
                              type: string
                              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                            balanceAsOf:
                              type: string
                              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                            interestBasis:
                              type: string
                              enum:
                                - REDUCING_BALANCE
                            periodConvention:
                              type: string
                              enum:
                                - DECLARED_FULL_MONTH_OR_EXPLICIT_DAYS
                            maturityDate:
                              type: string
                              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                            settleRemainingAtMaturity:
                              type: boolean
                            parties:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  reference:
                                    type: string
