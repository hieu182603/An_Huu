                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  dueDate:
                                    type: string
                                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                                  rate:
                                    oneOf:
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          kind:
                                            type: string
                                            enum:
                                              - EFFECTIVE_ANNUAL
                                          percent:
                                            type: string
                                            pattern: ^(0|[1-9]\d{0,2})(\.\d{1,10})?$
                                        required:
                                          - kind
                                          - percent
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          kind:
                                            type: string
                                            enum:
                                              - NOMINAL_ANNUAL_MONTHLY
                                          percent:
                                            type: string
                                            pattern: ^(0|[1-9]\d{0,2})(\.\d{1,10})?$
                                        required:
                                          - kind
                                          - percent
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          kind:
                                            type: string
                                            enum:
                                              - EFFECTIVE_MONTHLY
                                          percent:
                                            type: string
                                            pattern: ^(0|[1-9]\d{0,2})(\.\d{1,10})?$
                                        required:
                                          - kind
                                          - percent
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          kind:
                                            type: string
                                            enum:
                                              - SIMPLE_ANNUAL_DAILY
                                          percent:
                                            type: string
                                            pattern: ^(0|[1-9]\d{0,2})(\.\d{1,10})?$
                                          days:
                                            type: integer
                                            minimum: 1
                                            maximum: 366
                                          yearDays:
                                            anyOf:
                                              - type: integer
                                                enum:
                                                  - 360
                                              - type: integer
                                                enum:
                                                  - 365
                                              - type: integer
                                                enum:
                                                  - 366
                                        required:
                                          - kind
                                          - percent
                                          - days
                                          - yearDays
