DebtPatch:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    command:
      anyOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - ADD
                - UPDATE
            entry:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
                sharedLoanId:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                outstandingBalance:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                balanceAsOf:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  default: VND
                payment:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                paymentShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                balanceShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                contract:
