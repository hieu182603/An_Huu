                  type: object
                  additionalProperties: false
                  properties:
                    annualRatePercent:
                      oneOf:
                        - type: object
                          additionalProperties: false
                          properties:
                            status:
                              type: string
                              enum:
                                - KNOWN
                            value:
                              type: string
                              pattern: ^(0|[1-9]\d{0,2})(\.\d{1,10})?$
                          required:
                            - status
                            - value
                        - type: object
                          additionalProperties: false
                          properties:
                            status:
                              type: string
                              enum:
                                - UNKNOWN
                          required:
                            - status
                  required:
                    - annualRatePercent
                responsibility:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        scope:
                          type: string
                          enum: *a4
                        confirmedDocument:
                          type: string
                          minLength: 1
                          maxLength: 300
                        limit:
                          oneOf:
                            - type: object
                              additionalProperties: false
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - KNOWN
                                value:
                                  type: string
                                  pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                              required:
                                - status
                                - value
                            - type: object
                              additionalProperties: false
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - UNKNOWN
                              required:
                                - status
                      required:
                        - status
                        - scope
                        - confirmedDocument
                        - limit
                startMonth:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                endMonth:
                  anyOf:
                    - type: string
                      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                    - type: object
                      nullable: true
                      enum:
                        - null
                frequency:
                  type: string
                  enum: *a5
              required:
                - id
                - label
                - outstandingBalance
                - balanceAsOf
                - payment
                - paymentShare
                - balanceShare
                - responsibility
                - startMonth
                - endMonth
                - frequency
          required:
            - kind
