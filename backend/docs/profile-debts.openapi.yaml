                - DELETE
            id:
              type: string
              minLength: 1
              maxLength: 100
              pattern: ^[a-zA-Z0-9_-]+$
          required:
            - kind
            - id
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - CONFIRM_NONE
            reason:
              type: string
              minLength: 1
              maxLength: 300
          required:
            - kind
            - reason
  required:
    - expectedRevision
    - command
DebtReport:
  type: object
  additionalProperties: false
  properties:
    profileRevision:
      type: integer
    valuationDate:
      type: string
    currency:
      type: string
      enum:
        - VND
    debtState:
      type: string
      enum:
        - KNOWN
        - UNKNOWN
        - NOT_APPLICABLE
    totals:
      type: object
      additionalProperties: false
      properties:
        outstandingBalance:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        monthlyPayment:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        firstMonthInterest:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        monthlyIncome:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        monthlyExpense:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        availableMonthlySurplus:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        debtToIncomePercent:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
      required:
        - outstandingBalance
        - monthlyPayment
        - firstMonthInterest
        - monthlyIncome
        - monthlyExpense
        - availableMonthlySurplus
        - debtToIncomePercent
    loans:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
          status:
            type: string
            enum:
              - CONTRACT
              - ILLUSTRATIVE
              - DECLARED
              - INCOMPLETE
          outstandingBalance:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          monthlyPayment:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          firstMonthInterest:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          payoffDate:
            anyOf:
              - type: string
              - type: object
                nullable: true
                enum:
                  - null
          scheduleStatus:
            type: string
            enum:
              - READY
              - INCOMPLETE
              - HORIZON_LIMIT
              - NOT_DECLARED
          rate:
            anyOf:
              - type: object
                additionalProperties: false
                properties:
                  kind:
                    type: string
                  percent:
                    type: string
                required:
                  - kind
                  - percent
              - type: object
                nullable: true
                enum:
                  - null
          rows:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                dueDate:
                  type: string
                opening:
                  type: string
                principal:
                  type: string
                interest:
                  type: string
                fee:
                  type: string
                closing:
                  type: string
                userPayment:
                  type: string
                userPrincipal:
                  type: string
                userInterest:
                  type: string
                userFee:
                  type: string
              required:
                - dueDate
                - opening
                - principal
                - interest
                - fee
                - closing
                - userPayment
                - userPrincipal
                - userInterest
                - userFee
          issues:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                loanId:
                  anyOf:
                    - type: string
                    - type: object
                      nullable: true
                      enum:
                        - null
                code:
                  type: string
              required:
                - loanId
                - code
        required:
          - id
          - status
          - outstandingBalance
          - monthlyPayment
          - firstMonthInterest
          - payoffDate
          - scheduleStatus
          - rate
          - rows
          - issues
    issues:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          loanId:
            anyOf:
              - type: string
              - type: object
                nullable: true
                enum:
                  - null
          code:
            type: string
        required:
          - loanId
          - code
  required:
    - profileRevision
    - valuationDate
    - currency
    - debtState
    - totals
    - loans
    - issues
