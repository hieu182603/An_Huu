Revision:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
  required:
    - expectedRevision
Approve:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    impactToken:
      type: string
      pattern: ^[a-f0-9]{64}$
    reviewNote:
      type: string
      minLength: 3
      maxLength: 2000
  required:
    - expectedRevision
    - impactToken
    - reviewNote
Publish:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    confirm:
      type: boolean
      enum:
        - true
  required:
    - expectedRevision
    - confirm
ResolveInput:
  type: object
  additionalProperties: false
  properties:
    versionId:
      type: string
      format: uuid
    startMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    endMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    assetClass:
      type: string
      pattern: ^[A-Z][A-Z0-9_]{0,39}$
    horizonMonths:
      type: integer
      minimum: 1
      maximum: 1200
  required:
    - versionId
    - startMonth
    - endMonth
    - assetClass
    - horizonMonths
