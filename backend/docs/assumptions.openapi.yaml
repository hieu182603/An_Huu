      type: integer
      minimum: 1900
      maximum: 2199
    toYear:
      type: integer
      minimum: 1900
      maximum: 2199
    note:
      type: string
      minLength: 3
      maxLength: 2000
  required:
    - id
    - kind
    - title
    - publisher
    - url
    - release
    - publishedOn
    - retrievedOn
    - fromYear
    - toYear
    - note
Approval:
  type: object
  additionalProperties: false
  properties:
    actor: &a5
      type: string
      format: uuid
    approvedAt: &a7
      type: string
      format: date-time
    reviewNote:
      type: string
    documentHash:
      type: string
    baselineId:
      type: string
      format: uuid
      nullable: true
  required:
    - actor
    - approvedAt
    - reviewNote
    - documentHash
    - baselineId
Version:
  type: object
  additionalProperties: false
  properties:
    id: *a5
    version: &a6
      type: integer
    revision: *a6
    status:
      type: string
      enum:
        - DRAFT
        - APPROVED
        - PUBLISHED
    data:
      $ref: "#/Document"
    createdBy: *a5
    createdAt: *a7
    publishedBy:
      type: string
      format: uuid
      nullable: true
    effectiveAt:
      type: string
      format: date-time
      nullable: true
    approval:
      anyOf:
        - $ref: "#/Approval"
        - type: object
          nullable: true
          enum:
            - null
    documentHash:
      type: string
  required:
    - id
    - version
    - revision
    - status
    - data
    - createdBy
    - createdAt
    - publishedBy
    - effectiveAt
    - approval
    - documentHash
Issue:
  type: object
  additionalProperties: false
  properties:
    path:
      type: string
    code:
      type: string
  required:
    - path
    - code
Validation:
  type: object
  additionalProperties: false
  properties:
    status: &a8
      type: string
      enum:
        - VALID
        - INCOMPLETE
    issues: &a9
      type: array
      items:
        $ref: "#/Issue"
  required:
    - status
    - issues
Impact:
  type: object
  additionalProperties: false
  properties:
    status: *a8
    issues: *a9
    draftRevision: *a6
    impactToken:
      type: string
    baselineId:
      type: string
      format: uuid
      nullable: true
    scope:
      type: string
      enum:
        - CONFIGURATION_DIFF_ONLY
    planProjectionStatus:
      type: string
      enum:
        - AWAITING_T06
    currentPlansChanged:
      type: integer
      enum:
        - 0
    changes:
      type: object
      additionalProperties: false
      properties:
        before:
          anyOf:
            - $ref: "#/Document"
            - type: object
              nullable: true
              enum:
                - null
        after:
          $ref: "#/Document"
      required:
        - before
        - after
  required:
    - status
    - issues
    - draftRevision
    - impactToken
    - baselineId
    - scope
    - planProjectionStatus
    - currentPlansChanged
    - changes
List:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - AVAILABLE
        - UNCONFIGURED
    total: *a6
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id: *a5
          version: *a6
          revision: *a6
          status:
            type: string
            enum:
              - DRAFT
              - APPROVED
              - PUBLISHED
          title:
            type: string
          effectiveAt:
            type: string
            format: date-time
            nullable: true
          projectionStartYear: *a6
          projectionEndYear: *a6
        required:
          - id
          - version
          - revision
          - status
          - title
          - effectiveAt
          - projectionStartYear
          - projectionEndYear
    page: *a6
    limit: *a6
  required:
    - status
    - total
    - items
    - page
    - limit
Month:
  type: object
  additionalProperties: false
  properties:
    month:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    inflationAnnualPercent: &a10
      type: string
      pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
    returnAnnualNetNominalPercent: *a10
    inflationMonthlyFactor: *a10
    returnMonthlyFactor: *a10
    inflationKind:
      type: string
      enum:
        - FORECAST
        - LONG_TERM
    inflationSourceId:
      type: string
    returnSourceId:
      type: string
    assetClass:
      type: string
    horizonId:
      type: string
  required:
    - month
    - inflationAnnualPercent
    - returnAnnualNetNominalPercent
    - inflationMonthlyFactor
    - returnMonthlyFactor
    - inflationKind
    - inflationSourceId
    - returnSourceId
    - assetClass
    - horizonId
Resolution:
  type: object
  additionalProperties: false
  properties:
    versionId: *a5
    version: *a6
    documentHash:
      type: string
    currency:
      type: string
      enum:
        - VND
    priceBasis:
      type: string
      enum:
