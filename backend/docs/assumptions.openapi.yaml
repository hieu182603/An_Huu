Document:
  type: object
  additionalProperties: false
  properties:
    schemaVersion:
      type: integer
      enum:
        - 2
    title:
      type: string
      minLength: 3
      maxLength: 200
    currency:
      type: string
      enum:
        - VND
    effectiveFrom:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
    projectionStartYear:
      type: integer
      minimum: 1900
      maximum: 2199
    projectionEndYear:
      type: integer
      minimum: 1900
      maximum: 2199
    sources:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          kind:
            type: string
            enum: &a1
              - HISTORICAL_OFFICIAL
              - FORECAST
              - AN_HUU_LONG_TERM
              - ASSET_RESEARCH
          title:
            type: string
            minLength: 3
            maxLength: 200
          publisher:
            type: string
            minLength: 2
            maxLength: 150
          url:
            type: string
            format: uri
            maxLength: 2000
          release:
            type: string
            minLength: 1
            maxLength: 150
          publishedOn:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          retrievedOn:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          fromYear:
            type: integer
            minimum: 1900
            maximum: 2199
          toYear:
            type: integer
            minimum: 1900
            maximum: 2199
          note:
            type: string
            minLength: 3
            maxLength: 2000
        required:
          - id
          - kind
          - title
          - publisher
          - url
          - release
          - publishedOn
          - retrievedOn
          - fromYear
          - toYear
          - note
      maxItems: 100
    historicalCpi:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          year:
            type: integer
            minimum: 1900
            maximum: 2199
          percent:
            type: string
            pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
          sourceId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          measure:
            type: string
            enum: &a2
              - ANNUAL_AVERAGE_CHANGE
              - END_YEAR_CHANGE
        required:
          - year
          - percent
          - sourceId
          - measure
      maxItems: 300
    inflation:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          year:
            type: integer
            minimum: 1900
            maximum: 2199
          percent:
            type: string
            pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
          sourceId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          kind:
            type: string
            enum: &a3
              - FORECAST
              - LONG_TERM
          rateType:
            type: string
            enum:
              - EFFECTIVE_ANNUAL
          priceBasis:
            type: string
            enum:
              - NOMINAL
          conversionNote:
            type: string
            minLength: 3
            maxLength: 2000
        required:
          - year
          - percent
          - sourceId
          - kind
          - rateType
          - priceBasis
          - conversionNote
      maxItems: 300
    assetClasses:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          code:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          label:
            type: string
            minLength: 1
            maxLength: 120
          horizons:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  pattern: ^[A-Z][A-Z0-9_]{0,39}$
                minMonths:
                  type: integer
                  minimum: 1
                  maximum: 1200
                maxMonths:
                  type: integer
                  minimum: 1
                  maximum: 1200
              required:
                - id
                - minMonths
                - maxMonths
            minItems: 1
            maxItems: 10
        required:
          - code
          - label
          - horizons
      maxItems: 20
    returns:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          year:
            type: integer
            minimum: 1900
            maximum: 2199
          assetClass:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          horizonId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          sourceId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          rate:
            oneOf:
              - type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum:
                      - EFFECTIVE_ANNUAL
                  percent:
                    type: string
                    pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                required:
                  - type
                  - percent
              - type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum:
                      - NOMINAL_ANNUAL
                  percent:
                    type: string
                    pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                  compoundsPerYear:
                    type: integer
                    minimum: 1
                    maximum: 366
                required:
                  - type
                  - percent
                  - compoundsPerYear
          priceBasis:
            type: string
            enum: &a4
              - NOMINAL
              - REAL
          fees:
            oneOf:
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - INCLUDED
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - treatment
                  - evidence
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - EXPLICIT_ANNUAL_DRAG
                  percent:
                    type: string
                    pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                  convention:
                    type: string
                    enum:
                      - PERCENTAGE_POINTS_AFTER_NOMINAL_CONVERSION
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - treatment
                  - percent
                  - convention
                  - evidence
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - UNKNOWN
                required:
                  - treatment
          taxes:
            oneOf:
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - INCLUDED
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - treatment
                  - evidence
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - EXPLICIT_ANNUAL_DRAG
                  percent:
                    type: string
                    pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                  convention:
                    type: string
                    enum:
                      - PERCENTAGE_POINTS_AFTER_NOMINAL_CONVERSION
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - treatment
                  - percent
                  - convention
                  - evidence
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - UNKNOWN
                required:
                  - treatment
        required:
          - year
          - assetClass
          - horizonId
          - sourceId
          - rate
          - priceBasis
          - fees
          - taxes
      maxItems: 12000
    reason:
      type: string
      minLength: 3
      maxLength: 2000
  required:
    - schemaVersion
    - title
    - currency
    - effectiveFrom
    - projectionStartYear
    - projectionEndYear
    - sources
    - historicalCpi
    - inflation
    - assetClasses
    - returns
    - reason
  description: Drafts may be incomplete. Approval requires exactly one inflation
    entry and each declared asset/horizon return entry for every projection
    year, unique IDs, non-overlapping horizons, source coverage/kind and known
    fee/tax treatment. Rates must be greater than -100% and at most 100%.
    Historical CPI is reference only. effectiveFrom uses midnight UTC. No
    fallback or source extrapolation.
