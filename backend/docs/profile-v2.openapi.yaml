SummaryV2:
  type: object
  additionalProperties: false
  properties:
    currency:
      type: string
      enum:
        - VND
    valuationDate:
      $ref: "#/Date"
    periodUnit:
      type: string
      enum:
        - MONTH
    values:
      type: object
      additionalProperties: false
      properties:
        monthlyIncome:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        monthlyExpense:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        monthlyDebtService:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        totalAssets:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        totalDebt:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        netWorth:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        retirementLiquidAssets:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
        availableMonthlySurplus:
          type: string
          nullable: true
          pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
      required:
        - monthlyIncome
        - monthlyExpense
        - monthlyDebtService
        - totalAssets
        - totalDebt
        - netWorth
        - retirementLiquidAssets
        - availableMonthlySurplus
    issues:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          path:
            type: string
          code:
            type: string
            description: Specific missing-data/valuation/contract issue code; contract
              errors do not fall back to the legacy payment.
        required:
          - path
          - code
  required:
    - currency
    - valuationDate
    - periodUnit
    - values
    - issues
DataQuality:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - LEGACY_UNREVIEWED
        - EXPLICIT_STATES
    unconfirmedZeroFields:
      type: array
      items:
        type: string
  required:
    - status
    - unconfirmedZeroFields
