Registry:
  type: object
  additionalProperties: false
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    startMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    endMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    knowledgeAsOf:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
    originHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    registryHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    revisions:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          sourceId:
            type: string
            minLength: 1
            maxLength: 200
          revision:
            type: integer
            minimum: 1
          previousHash:
            anyOf:
              - type: string
                pattern: ^[a-f0-9]{64}$
              - type: object
                nullable: true
                enum:
                  - null
          sourceHash:
            type: string
            pattern: ^[a-f0-9]{64}$
          scope:
            type: string
            enum:
              - PLAN_VERSION
          origin:
            type: string
            enum:
              - PINNED_PROFILE
              - PLAN_CREATED
              - LEGACY_AGGREGATE
              - PLAN_ASSUMPTION
          kind:
            type: string
            enum:
              - INCOME
              - EXPENSE
              - PENSION
              - ASSET_CAPITAL
              - DEBT
              - AGGREGATE
          effectiveFromMonth:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          effectiveToMonth:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          knownOn:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          evidenceHash:
            type: string
            pattern: ^[a-f0-9]{64}$
          commandId:
            type: string
            minLength: 1
            maxLength: 200
          confirmation:
            type: string
            enum:
              - USER_CONFIRMED
              - HYPOTHETICAL
              - BANK_CONFIRMED
          operation:
            type: string
            enum:
              - CREATE
              - REVISE
              - END
          schedule:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                month:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                metric:
                  type: string
                  enum: &a5
                    - income
                    - pension
                    - livingExpense
                    - additionalExpense
                    - debtPayment
                    - capitalInjection
                amount:
                  type: string
                  maxLength: 160
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
              required:
                - month
                - metric
                - amount
            maxItems: 7200
        required:
          - sourceId
          - revision
          - previousHash
          - sourceHash
          - scope
          - origin
          - kind
          - effectiveFromMonth
          - effectiveToMonth
          - knownOn
          - evidenceHash
          - commandId
          - confirmation
          - operation
          - schedule
      maxItems: 5000
  required:
    - schemaVersion
    - startMonth
    - endMonth
    - knowledgeAsOf
    - originHash
    - registryHash
    - revisions
Budget:
  type: object
  additionalProperties: false
  properties:
    originalRetirementMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    startFunding:
      anyOf:
        - type: object
          additionalProperties: false
          properties:
            monthlyAvailable:
              type: string
              maxLength: 160
              pattern: ^(0|[1-9]\d*)(\.\d+)?$
            schedule:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  month:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  amount:
                    type: string
                    maxLength: 160
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                required:
                  - month
                  - amount
              maxItems: 1200
          required:
            - monthlyAvailable
            - schedule
        - type: object
          nullable: true
          enum:
            - null
  required:
    - originalRetirementMonth
    - startFunding
PensionSourceSelection:
  type: object
  additionalProperties: false
  properties:
    estimateId:
      type: string
      format: uuid
    expectedEstimateIntegrityHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    expectedRegistryHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    commandId:
      type: string
      format: uuid
    sourceId:
      type: string
      minLength: 1
      maxLength: 200
    operation:
      type: string
      enum:
        - CREATE
        - REVISE
    expectedSourceRevision:
      type: integer
      minimum: 0
    effectiveFromMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    effectiveToMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    amountPolicy:
      type: string
      enum:
        - FIXED_NOMINAL
    confirm:
      type: boolean
      enum:
        - true
  required:
    - estimateId
    - expectedEstimateIntegrityHash
    - expectedRegistryHash
    - commandId
    - sourceId
    - operation
    - expectedSourceRevision
    - effectiveFromMonth
    - effectiveToMonth
    - amountPolicy
    - confirm
PensionSourceEvidence:
  type: object
  additionalProperties: false
  properties:
    estimateId:
      type: string
      format: uuid
    ownerId:
      type: string
      minLength: 1
    estimateIntegrityHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    capture:
      type: object
      additionalProperties: false
      properties:
        formatVersion:
          type: integer
          enum:
            - 1
        engineCode:
          type: string
          enum:
            - vn-pension-benefit-v1
            - vn-pension-benefit-v2
            - vn-pension-state-v1
        assessedOn:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
        input:
          type: object
          additionalProperties: false
          properties:
            historyVersionId:
              type: string
              format: uuid
            expectedHistoryRevision:
              type: integer
              minimum: 1
            legalRuleSetVersionId:
              type: string
              format: uuid
            intendedBenefitDate:
              type: string
              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
            employmentEndDate:
              anyOf:
                - type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                - type: object
                  nullable: true
                  enum:
                    - null
            contributionStopMonth:
              anyOf:
                - type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                - type: object
                  nullable: true
                  enum:
                    - null
            benefitRequestDate:
              anyOf:
                - type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                - type: object
                  nullable: true
                  enum:
                    - null
            futureContributions:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  month:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  scheme:
                    type: string
                    enum: &a1
                      - COMPULSORY
                      - VOLUNTARY
                      - UNKNOWN
                  salaryRegime:
                    type: string
                    enum: &a2
                      - EMPLOYER
                      - STATE
                      - VOLUNTARY_INCOME
                      - UNKNOWN
                  status:
                    type: string
                    enum: &a3
                      - PAID
                      - CREDITED
                      - UNKNOWN
                      - WITHDRAWN
                      - NOT_CONTRIBUTED
                  contributionBase:
                    anyOf:
                      - type: string
                        pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                      - type: object
                        nullable: true
                        enum:
                          - null
                  participantCategory:
                    type: string
                    enum: &a4
                      - ARTICLE_2_1_A
                      - ARTICLE_2_1_B
                      - ARTICLE_2_1_C
                      - ARTICLE_2_1_D
                      - ARTICLE_2_1_DD
                      - ARTICLE_2_1_G
                      - ARTICLE_2_1_I
                      - OTHER
                      - UNKNOWN
                  stateSalary:
                    type: object
                    additionalProperties: false
                    properties:
                      kind:
                        type: string
                        enum:
                          - CURRENT_SCALE_COEFFICIENT
                      totalContributionCoefficient:
                        type: string
                        pattern: ^(0|[1-9]\d{0,3})(\.\d{1,12})?$
                      evidence:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            reference:
                              type: string
                              minLength: 1
                              maxLength: 300
                            contentHash:
                              type: string
                              pattern: ^[a-f0-9]{64}$
                            confirmedOn:
                              type: string
                              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                          required:
                            - reference
                            - contentHash
                            - confirmedOn
                        minItems: 1
                        maxItems: 20
                    required:
                      - kind
                      - totalContributionCoefficient
                      - evidence
                  creditKind:
                    type: string
                    minLength: 1
                    maxLength: 100
                  evidence:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        reference:
                          type: string
                          minLength: 1
                          maxLength: 300
                        contentHash:
                          type: string
                          pattern: ^[a-f0-9]{64}$
                        confirmedOn:
                          type: string
                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                      required:
                        - reference
                        - contentHash
                        - confirmedOn
                    maxItems: 20
                required:
                  - month
                  - scheme
                  - salaryRegime
                  - status
                  - contributionBase
                  - evidence
              maxItems: 1200
            caseDetails:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                    - NORMAL_EMPLOYEE
                participationAtRetirement:
                  type: string
                  enum:
                    - ACTIVE_COMPULSORY
                    - PRESERVED
                benefitStart:
                  type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      enum:
                        - EMPLOYER_NOTICE
                        - PERSON_REQUEST
                        - HYPOTHETICAL
                    month:
                      type: string
                      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                    evidence:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          reference:
                            type: string
                            minLength: 1
                            maxLength: 300
                          contentHash:
                            type: string
                            pattern: ^[a-f0-9]{64}$
                          confirmedOn:
                            type: string
                            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                        required:
                          - reference
                          - contentHash
                          - confirmedOn
                      minItems: 1
                      maxItems: 20
                  required:
                    - kind
                    - month
                    - evidence
              required:
                - kind
                - participationAtRetirement
                - benefitStart
            stateSalaryCase:
              type: object
              additionalProperties: false
              properties:
                firstParticipationMonth:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                firstParticipationEvidence:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      reference:
                        type: string
                        minLength: 1
                        maxLength: 300
                      contentHash:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      confirmedOn:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                    required:
                      - reference
                      - contentHash
                      - confirmedOn
                  minItems: 1
                  maxItems: 20
                salaryTreatment:
                  type: string
                  enum:
                    - ORDINARY
                    - HAZARDOUS_TRANSFER
                    - MILITARY_TRANSFER
                    - SENIORITY_ALLOWANCE_TRANSFER
                    - UNKNOWN
                treatmentEvidence:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      reference:
                        type: string
                        minLength: 1
                        maxLength: 300
                      contentHash:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      confirmedOn:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                    required:
                      - reference
                      - contentHash
                      - confirmedOn
                  minItems: 1
                  maxItems: 20
              required:
                - firstParticipationMonth
                - firstParticipationEvidence
                - salaryTreatment
                - treatmentEvidence
          required:
            - historyVersionId
            - expectedHistoryRevision
            - legalRuleSetVersionId
            - intendedBenefitDate
            - employmentEndDate
            - contributionStopMonth
            - benefitRequestDate
            - futureContributions
        history:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            revision:
              type: integer
              minimum: 0
            documentHash:
              type: string
              pattern: ^[a-f0-9]{64}$
            document:
              type: object
              additionalProperties: false
              properties:
                schemaVersion:
                  type: integer
                  enum:
                    - 1
                birth:
                  type: object
                  additionalProperties: false
                  properties:
                    precision:
                      type: string
                      enum:
                        - DAY
                        - MONTH
                        - YEAR
                        - UNKNOWN
                    declaredValue:
                      anyOf:
                        - type: string
                          maxLength: 10
                        - type: object
                          nullable: true
                          enum:
                            - null
                  required:
                    - precision
                    - declaredValue
                legalSex:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                    - UNKNOWN
                coverageFrom:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                coverageThrough:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                confirmedThroughMonth:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                months:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      month:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      scheme:
                        type: string
                        enum: *a1
                      salaryRegime:
                        type: string
                        enum: *a2
                      status:
                        type: string
                        enum: *a3
                      contributionBase:
                        anyOf:
                          - type: string
                            pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                          - type: object
                            nullable: true
                            enum:
                              - null
                      participantCategory:
                        type: string
                        enum: *a4
                      stateSalary:
                        type: object
                        additionalProperties: false
                        properties:
                          kind:
                            type: string
                            enum:
                              - CURRENT_SCALE_COEFFICIENT
                          totalContributionCoefficient:
                            type: string
                            pattern: ^(0|[1-9]\d{0,3})(\.\d{1,12})?$
                          evidence:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                reference:
                                  type: string
                                  minLength: 1
                                  maxLength: 300
                                contentHash:
                                  type: string
                                  pattern: ^[a-f0-9]{64}$
                                confirmedOn:
                                  type: string
                                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                              required:
                                - reference
                                - contentHash
                                - confirmedOn
                            minItems: 1
                            maxItems: 20
                        required:
                          - kind
                          - totalContributionCoefficient
                          - evidence
                      creditKind:
                        type: string
                        minLength: 1
                        maxLength: 100
                      evidence:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            reference:
                              type: string
                              minLength: 1
                              maxLength: 300
                            contentHash:
                              type: string
                              pattern: ^[a-f0-9]{64}$
                            confirmedOn:
                              type: string
                              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                          required:
                            - reference
                            - contentHash
                            - confirmedOn
                        maxItems: 20
                    required:
                      - month
                      - scheme
                      - salaryRegime
                      - status
                      - contributionBase
                      - evidence
                  maxItems: 1200
                specialPeriods:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      kind:
                        type: string
                        minLength: 1
                        maxLength: 100
                      startMonth:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      endMonth:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      evidence:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            reference:
                              type: string
                              minLength: 1
                              maxLength: 300
                            contentHash:
                              type: string
                              pattern: ^[a-f0-9]{64}$
                            confirmedOn:
                              type: string
                              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                          required:
                            - reference
                            - contentHash
                            - confirmedOn
                        minItems: 1
                        maxItems: 20
                    required:
                      - kind
                      - startMonth
                      - endMonth
                      - evidence
                  maxItems: 200
              required:
                - schemaVersion
                - birth
                - legalSex
                - coverageFrom
                - coverageThrough
                - confirmedThroughMonth
                - months
                - specialPeriods
          required:
            - id
            - revision
            - documentHash
            - document
        rule:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 0
            documentHash:
              type: string
              pattern: ^[a-f0-9]{64}$
            knowledgeAsOf:
              type: string
              format: date-time
            publishedAt:
              type: string
              format: date-time
            validationHash:
              type: string
              pattern: ^[a-f0-9]{64}$
            reviewHash:
              type: string
              pattern: ^[a-f0-9]{64}$
            draft:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: ^[A-Z0-9_-]{1,100}$
                effectiveFrom:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                effectiveTo:
                  anyOf:
                    - type: string
                      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                    - type: object
                      nullable: true
                      enum:
                        - null
                supersedesId:
                  anyOf:
                    - type: string
                      format: uuid
                    - type: object
                      nullable: true
                      enum:
                        - null
                  default: null
                document:
                  type: object
                  additionalProperties: false
                  properties:
                    schemaVersion:
                      type: integer
                      enum:
                        - 1
                    engineCode:
                      type: string
                      minLength: 1
                      maxLength: 100
                    coverage:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          branch:
                            type: string
                            minLength: 1
                            maxLength: 100
                          strategyCode:
                            type: string
                            minLength: 1
                            maxLength: 100
                          citationIds:
                            type: array
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                            minItems: 1
                            maxItems: 50
                          requiredTableKeys:
                            type: array
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                            maxItems: 200
                        required:
                          - branch
                          - strategyCode
                          - citationIds
                          - requiredTableKeys
                      minItems: 1
                      maxItems: 100
                    citations:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 100
                          instrument:
                            type: string
                            minLength: 1
                            maxLength: 200
                          locator:
                            type: string
                            minLength: 1
                            maxLength: 200
                          url:
                            type: string
                            format: uri
                            maxLength: 1000
                          contentHash:
                            type: string
                            pattern: ^[a-f0-9]{64}$
                          effectiveFrom:
                            type: string
                            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                          effectiveTo:
                            anyOf:
                              - type: string
                                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                              - type: object
                                nullable: true
                                enum:
                                  - null
                        required:
                          - id
                          - instrument
                          - locator
                          - url
                          - contentHash
                          - effectiveFrom
                          - effectiveTo
                      minItems: 1
                      maxItems: 200
                    tables:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          kind:
                            type: string
                            enum:
                              - AGE_MONTHS
                              - WAGE_FACTOR
                              - INCOME_FACTOR
                              - REFERENCE_AMOUNT
                              - FUND_MONTHLY_RATE
                          key:
                            type: string
                            minLength: 1
                            maxLength: 100
                          value:
                            type: string
                            maxLength: 80
                            pattern: ^-?(0|[1-9]\d{0,30})(\.\d{1,30})?$
                          effectiveFrom:
                            type: string
                            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                          effectiveTo:
                            anyOf:
                              - type: string
                                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                              - type: object
                                nullable: true
                                enum:
                                  - null
                          citationId:
                            type: string
                            minLength: 1
                            maxLength: 100
                        required:
                          - kind
                          - key
                          - value
                          - effectiveFrom
                          - effectiveTo
                          - citationId
                      maxItems: 5000
                  required:
                    - schemaVersion
                    - engineCode
                    - coverage
                    - citations
                    - tables
              required:
                - code
                - effectiveFrom
                - effectiveTo
                - document
          required:
            - id
            - version
            - documentHash
            - knowledgeAsOf
            - publishedAt
            - validationHash
            - reviewHash
            - draft
      required:
        - formatVersion
        - engineCode
        - assessedOn
