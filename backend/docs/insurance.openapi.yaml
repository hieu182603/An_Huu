HistoryDocument:
  type: object
  additionalProperties: false
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    birth:
      type: object
      additionalProperties: false
      properties:
        precision:
          type: string
          enum: &a1
            - DAY
            - MONTH
            - YEAR
            - UNKNOWN
        declaredValue:
          anyOf:
            - type: string
              maxLength: 10
            - type: object
              nullable: true
              enum:
                - null
      required:
        - precision
        - declaredValue
    legalSex:
      type: string
      enum: &a2
        - MALE
        - FEMALE
        - UNKNOWN
    coverageFrom:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    coverageThrough:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    confirmedThroughMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    months:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          month:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          scheme:
            type: string
            enum: &a3
              - COMPULSORY
              - VOLUNTARY
              - UNKNOWN
          salaryRegime:
            type: string
            enum: &a4
              - EMPLOYER
              - STATE
              - VOLUNTARY_INCOME
              - UNKNOWN
          status:
            type: string
            enum: &a5
              - PAID
              - CREDITED
              - UNKNOWN
              - WITHDRAWN
              - NOT_CONTRIBUTED
          contributionBase:
            anyOf:
              - type: string
                pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
              - type: object
                nullable: true
                enum:
                  - null
          participantCategory:
            type: string
            enum: &a6
              - ARTICLE_2_1_A
              - ARTICLE_2_1_B
              - ARTICLE_2_1_C
              - ARTICLE_2_1_D
              - ARTICLE_2_1_DD
              - ARTICLE_2_1_G
              - ARTICLE_2_1_I
              - OTHER
              - UNKNOWN
          stateSalary:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                  - CURRENT_SCALE_COEFFICIENT
              totalContributionCoefficient:
                type: string
                pattern: ^(0|[1-9]\d{0,3})(\.\d{1,12})?$
              evidence:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    reference:
                      type: string
                      minLength: 1
                      maxLength: 300
                    contentHash:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    confirmedOn:
                      type: string
                      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                  required:
                    - reference
                    - contentHash
                    - confirmedOn
                minItems: 1
                maxItems: 20
            required:
              - kind
              - totalContributionCoefficient
              - evidence
          creditKind:
            type: string
            minLength: 1
            maxLength: 100
          evidence:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                reference:
                  type: string
                  minLength: 1
                  maxLength: 300
                contentHash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                confirmedOn:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
              required:
                - reference
                - contentHash
                - confirmedOn
            maxItems: 20
        required:
          - month
          - scheme
          - salaryRegime
          - status
          - contributionBase
          - evidence
      maxItems: 1200
    specialPeriods:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            minLength: 1
            maxLength: 100
          startMonth:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          endMonth:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          evidence:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                reference:
                  type: string
                  minLength: 1
                  maxLength: 300
                contentHash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                confirmedOn:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
              required:
                - reference
                - contentHash
                - confirmedOn
            minItems: 1
            maxItems: 20
        required:
          - kind
          - startMonth
          - endMonth
          - evidence
      maxItems: 200
  required:
    - schemaVersion
    - birth
    - legalSex
    - coverageFrom
    - coverageThrough
    - confirmedThroughMonth
    - months
    - specialPeriods
