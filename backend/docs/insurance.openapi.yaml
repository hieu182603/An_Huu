RuleDraft:
  type: object
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: ^[A-Z0-9_-]{1,100}$
    effectiveFrom:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
    effectiveTo:
      anyOf:
        - type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
        - type: object
          nullable: true
          enum:
            - null
    supersedesId:
      anyOf:
        - type: string
          format: uuid
        - type: object
          nullable: true
          enum:
            - null
      default: null
    document:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        engineCode:
          type: string
          minLength: 1
          maxLength: 100
        coverage:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              branch:
                type: string
                minLength: 1
                maxLength: 100
              strategyCode:
                type: string
                minLength: 1
                maxLength: 100
              citationIds:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 100
                minItems: 1
                maxItems: 50
              requiredTableKeys:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 100
                maxItems: 200
            required:
              - branch
              - strategyCode
              - citationIds
              - requiredTableKeys
          minItems: 1
          maxItems: 100
        citations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 100
              instrument:
                type: string
                minLength: 1
                maxLength: 200
              locator:
                type: string
                minLength: 1
                maxLength: 200
              url:
                type: string
                format: uri
                maxLength: 1000
              contentHash:
                type: string
                pattern: ^[a-f0-9]{64}$
              effectiveFrom:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
              effectiveTo:
                anyOf:
                  - type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                  - type: object
                    nullable: true
                    enum:
                      - null
            required:
              - id
              - instrument
              - locator
              - url
              - contentHash
              - effectiveFrom
              - effectiveTo
          minItems: 1
          maxItems: 200
        tables:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: &a8
                  - AGE_MONTHS
                  - WAGE_FACTOR
                  - INCOME_FACTOR
                  - REFERENCE_AMOUNT
                  - FUND_MONTHLY_RATE
              key:
                type: string
                minLength: 1
                maxLength: 100
              value:
                type: string
                maxLength: 80
                pattern: ^-?(0|[1-9]\d{0,30})(\.\d{1,30})?$
              effectiveFrom:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
              effectiveTo:
                anyOf:
                  - type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                  - type: object
                    nullable: true
                    enum:
                      - null
              citationId:
                type: string
                minLength: 1
                maxLength: 100
            required:
              - kind
              - key
              - value
              - effectiveFrom
              - effectiveTo
              - citationId
          maxItems: 5000
      required:
        - schemaVersion
        - engineCode
        - coverage
        - citations
        - tables
  required:
    - code
    - effectiveFrom
    - effectiveTo
    - document
