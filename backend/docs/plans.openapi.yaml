ReforecastInput:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    expectedInputHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    preview:
      type: object
      additionalProperties: false
      properties:
        planId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        throughMonth:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
        expectedProfileRevision:
          type: integer
          minimum: 1
        futureChanges:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              field:
                type: string
                enum:
                  - income
                  - livingExpense
                  - additionalExpense
                  - plannedContribution
              operation:
                type: string
                enum:
                  - REPLACE_MONTHLY_TOTAL
              amount:
                type: string
                pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
              startMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              endMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              reason:
                type: string
                minLength: 1
                maxLength: 500
            required:
              - id
              - field
              - operation
              - amount
              - startMonth
              - endMonth
              - reason
          maxItems: 200
          default: []
        sourceChanges:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  confirmed:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: string
                    minLength: 1
                    maxLength: 500
                  kind:
                    type: string
                    enum:
                      - DEBT_SETTLED
                  sourceId:
                    type: string
                    minLength: 1
                    maxLength: 100
                  actual:
                    type: object
                    additionalProperties: false
                    properties:
                      period:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      eventId:
                        type: string
                        format: uuid
                    required:
                      - period
                      - eventId
                  remainingObligation:
                    type: string
                    enum:
                      - "0"
                required:
                  - id
                  - confirmed
                  - document
                  - kind
                  - sourceId
                  - actual
                  - remainingObligation
              - type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  confirmed:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: string
                    minLength: 1
                    maxLength: 500
                  kind:
                    type: string
                    enum:
                      - ASSET_REALIZED
                  sourceId:
                    type: string
                    minLength: 1
                    maxLength: 100
                  actual:
                    type: object
                    additionalProperties: false
                    properties:
                      period:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      eventId:
                        type: string
                        format: uuid
                    required:
                      - period
                      - eventId
                required:
                  - id
                  - confirmed
                  - document
                  - kind
                  - sourceId
                  - actual
              - type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  confirmed:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: string
                    minLength: 1
                    maxLength: 500
                  kind:
                    type: string
                    enum:
                      - PENSION_REPLACE
                  sourceId:
                    type: string
                    enum:
                      - pension
                  startMonth:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  endMonth:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  monthlyAmount:
                    type: string
                    pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                  priceBasis:
                    type: string
                    enum:
                      - NOMINAL_MONTHLY
                required:
                  - id
                  - confirmed
                  - document
                  - kind
                  - sourceId
                  - startMonth
                  - endMonth
                  - monthlyAmount
                  - priceBasis
              - type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  confirmed:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: string
                    minLength: 1
                    maxLength: 500
                  kind:
                    type: string
                    enum:
                      - FLOW_REPLACE
                  sourceType:
                    type: string
                    enum:
                      - INCOME
                      - EXPENSE
                  sourceId:
                    type: string
                    minLength: 1
                    maxLength: 100
                  startMonth:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  endMonth:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  monthlyAmount:
                    type: string
                    pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                required:
                  - id
                  - confirmed
                  - document
                  - kind
                  - sourceType
                  - sourceId
                  - startMonth
                  - endMonth
                  - monthlyAmount
          maxItems: 200
      required:
        - planId
        - versionId
        - throughMonth
        - expectedProfileRevision
  required:
    - expectedRevision
    - expectedInputHash
    - preview
CreateInput:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 0
    expectedInputHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    preview:
      type: object
      additionalProperties: false
      properties:
        expectedProfileRevision:
          type: integer
          minimum: 1
        policyVersionId:
          type: string
          format: uuid
        scenario:
          type: string
          enum: &a1
            - BASE
            - ADVERSE
            - FAVORABLE
        templateId:
          type: string
          minLength: 1
          maxLength: 100
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              questionId:
                type: string
                minLength: 1
                maxLength: 100
              choiceId:
                type: string
                minLength: 1
                maxLength: 100
            required:
              - questionId
              - choiceId
          maxItems: 30
        liquidityNeedMonths:
          type: integer
          minimum: 0
          maximum: 1200
        endMonth:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
        monthlyExpenseToday:
          type: string
          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
        monthlyContribution:
          type: string
          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
        monthlyReserve:
          type: string
          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
        contributionTiming:
          type: string
          enum: &a2
            - END_OF_MONTH
            - START_OF_MONTH
          default: END_OF_MONTH
        surplusPolicy:
          type: string
          enum:
            - EXPLICIT_DEPOSITS_ONLY
          default: EXPLICIT_DEPOSITS_ONLY
        startOfMonthFunding:
          type: object
          additionalProperties: false
          properties:
            confirmed:
              type: boolean
              enum:
                - true
            source:
              type: string
              enum:
                - CURRENT_MONTH_DISPOSABLE_CASH_AVAILABLE_AT_START
            monthlyAvailable:
              type: string
              pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
            schedule:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  month:
                    type: string
                    pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                  amount:
                    type: string
                    pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                required:
                  - month
                  - amount
              maxItems: 1200
              default: &a3 []
          required:
            - confirmed
            - source
            - monthlyAvailable
        terminalBalance:
          type: string
          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
          default: "0"
        contributionSchedule:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              month:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              amount:
                type: string
                pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
            required:
              - month
              - amount
          maxItems: 1200
          default: &a4 []
        retirementContributionSchedule:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              month:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              amount:
                type: string
                pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
            required:
              - month
              - amount
          maxItems: 1200
          default: &a5 []
        retirementIncomeIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 200
        retirementAdditionalExpenseIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 200
          default: &a6 []
        debtStress:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              loanId:
                type: string
                minLength: 1
                maxLength: 100
                pattern: ^[a-zA-Z0-9_-]+$
              startMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              endMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              totalPaymentShare:
                type: string
                pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
            required:
              - loanId
              - startMonth
              - endMonth
              - totalPaymentShare
          maxItems: 20
          default: &a7 []
        whatIf:
          type: object
          additionalProperties: false
          properties:
            retirementMonth:
              type: string
              pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
            assetValues:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  assetId:
                    type: string
                    minLength: 1
                    maxLength: 100
                  value:
                    type: string
                    pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                required:
                  - assetId
                  - value
              minItems: 1
              maxItems: 200
        housing:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              assetId:
                type: string
                minLength: 1
                maxLength: 100
              amountScope:
                type: string
                enum: &a8
                  - WHOLE_ASSET
                  - OWNERS_SHARE
              linkedIncomeId:
                type: string
                minLength: 1
                maxLength: 100
            required:
              - assetId
              - amountScope
          maxItems: 200
          default: &a9 []
      required:
        - expectedProfileRevision
        - policyVersionId
        - scenario
        - answers
        - liquidityNeedMonths
        - endMonth
        - monthlyExpenseToday
        - monthlyContribution
        - monthlyReserve
        - retirementIncomeIds
  required:
    - expectedRevision
    - expectedInputHash
    - preview
