Version:
  type: object
  additionalProperties: false
  required:
    - id
    - planId
    - version
    - createdAt
    - profileRevision
    - snapshotHash
    - preview
  properties:
    id: &a10
      type: string
      format: uuid
    planId: *a10
    version: &a11
      type: integer
    createdAt: &a41
      type: string
      format: date-time
    profileRevision: *a11
    snapshotHash: &a38
      type: string
    preview: &a42
      oneOf:
        - $ref: ./retirement.openapi.yaml#/Preview
        - $ref: ./source-snapshot.openapi.yaml#/Preview
SourcePreviewInput:
  type: object
  additionalProperties: false
  properties:
    versionId:
      type: string
      format: uuid
    expectedSnapshotHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    expectedRevision:
      type: integer
      minimum: 1
    expectedProfileRevision:
      type: integer
      minimum: 1
    throughMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    sourceCommands:
      type: array
      items:
        oneOf:
          - type: object
            additionalProperties: false
            properties:
              commandId:
                type: string
                format: uuid
              sourceId:
                type: string
                minLength: 1
                maxLength: 200
              expectedSourceRevision:
                type: integer
                minimum: 0
              effectiveFromMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              effectiveToMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              confirm:
                type: boolean
                enum:
                  - true
              document:
                type: string
                minLength: 1
                maxLength: 2000
              operation:
                type: string
                enum:
                  - CREATE
              metric:
                type: string
                enum: &a28
                  - income
                  - livingExpense
                  - additionalExpense
                  - pension
              frequency:
                type: string
                enum: &a29
                  - ONCE
                  - MONTHLY
              amount:
                type: string
                maxLength: 160
                pattern: ^(0|[1-9]\d*)(\.\d+)?$
              currency:
                type: string
                enum:
                  - VND
              confirmation:
                type: string
                enum: &a30
                  - USER_CONFIRMED
                  - HYPOTHETICAL
            required:
              - commandId
              - sourceId
              - expectedSourceRevision
              - effectiveFromMonth
              - effectiveToMonth
              - confirm
              - document
              - operation
              - metric
              - frequency
              - amount
              - currency
              - confirmation
