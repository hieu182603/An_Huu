Version:
  type: object
  additionalProperties: false
  required:
    - id
    - planId
    - version
    - createdAt
    - profileRevision
    - snapshotHash
    - preview
  properties:
    id: &a10
      type: string
      format: uuid
    planId: *a10
    version: &a11
      type: integer
    createdAt: &a23
      type: string
      format: date-time
    profileRevision: *a11
    snapshotHash: &a20
      type: string
    preview: &a24
      oneOf:
        - $ref: ./retirement.openapi.yaml#/Preview
        - $ref: ./source-snapshot.openapi.yaml#/Preview
SourcePreviewInput:
  type: object
  additionalProperties: false
  properties:
    versionId:
      type: string
      format: uuid
    expectedSnapshotHash:
      type: string
      pattern: ^[a-f0-9]{64}$
    expectedRevision:
      type: integer
      minimum: 1
    expectedProfileRevision:
      type: integer
      minimum: 1
    throughMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    sourceCommands:
      type: array
      items:
        oneOf:
          - type: object
            additionalProperties: false
            properties:
              commandId:
                type: string
                format: uuid
              sourceId:
                type: string
                minLength: 1
                maxLength: 200
              expectedSourceRevision:
                type: integer
                minimum: 0
              effectiveFromMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              effectiveToMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              confirm:
                type: boolean
                enum:
                  - true
              document:
                type: string
                minLength: 1
                maxLength: 2000
              operation:
                type: string
                enum:
                  - CREATE
              metric:
                type: string
                enum: &a12
                  - income
                  - livingExpense
                  - additionalExpense
                  - pension
              frequency:
                type: string
                enum: &a13
                  - ONCE
                  - MONTHLY
              amount:
                type: string
                maxLength: 160
                pattern: ^(0|[1-9]\d*)(\.\d+)?$
              currency:
                type: string
                enum:
                  - VND
              confirmation:
                type: string
                enum: &a14
                  - USER_CONFIRMED
                  - HYPOTHETICAL
            required:
              - commandId
              - sourceId
              - expectedSourceRevision
              - effectiveFromMonth
              - effectiveToMonth
              - confirm
              - document
              - operation
              - metric
              - frequency
              - amount
              - currency
              - confirmation
          - type: object
            additionalProperties: false
            properties:
              commandId:
                type: string
                format: uuid
              sourceId:
                type: string
                minLength: 1
                maxLength: 200
              expectedSourceRevision:
                type: integer
                minimum: 0
              effectiveFromMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              effectiveToMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              confirm:
                type: boolean
                enum:
                  - true
              document:
                type: string
                minLength: 1
                maxLength: 2000
              operation:
                type: string
                enum:
                  - REVISE
              metric:
                type: string
                enum: &a15
                  - income
                  - livingExpense
                  - additionalExpense
                  - pension
              frequency:
                type: string
                enum: &a16
                  - ONCE
                  - MONTHLY
              amount:
                type: string
                maxLength: 160
                pattern: ^(0|[1-9]\d*)(\.\d+)?$
              currency:
                type: string
                enum:
                  - VND
              confirmation:
                type: string
                enum: &a17
                  - USER_CONFIRMED
                  - HYPOTHETICAL
            required:
              - commandId
              - sourceId
              - expectedSourceRevision
              - effectiveFromMonth
              - effectiveToMonth
              - confirm
              - document
              - operation
              - metric
              - frequency
              - amount
              - currency
              - confirmation
          - type: object
            additionalProperties: false
            properties:
              commandId:
                type: string
                format: uuid
              sourceId:
                type: string
                minLength: 1
                maxLength: 200
              expectedSourceRevision:
                type: integer
                minimum: 0
              effectiveFromMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              effectiveToMonth:
                type: string
                pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
              confirm:
                type: boolean
                enum:
                  - true
              document:
                type: string
                minLength: 1
                maxLength: 2000
              operation:
                type: string
                enum:
                  - END
            required:
              - commandId
              - sourceId
              - expectedSourceRevision
              - effectiveFromMonth
              - effectiveToMonth
              - confirm
              - document
              - operation
      maxItems: 100
    pensionSelections:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          estimateId:
            type: string
            format: uuid
          expectedEstimateIntegrityHash:
            type: string
            pattern: ^[a-f0-9]{64}$
          expectedRegistryHash:
            type: string
            pattern: ^[a-f0-9]{64}$
          commandId:
            type: string
            format: uuid
          sourceId:
            type: string
            minLength: 1
            maxLength: 200
          operation:
            type: string
            enum: &a18
              - CREATE
              - REVISE
          expectedSourceRevision:
            type: integer
            minimum: 0
          effectiveFromMonth:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          effectiveToMonth:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          amountPolicy:
            type: string
            enum:
              - FIXED_NOMINAL
          confirm:
            type: boolean
