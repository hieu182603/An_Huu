MarketDocument:
  type: object
  additionalProperties: false
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    title:
      type: string
      minLength: 3
      maxLength: 2000
    reason:
      type: string
      minLength: 3
      maxLength: 2000
    effectiveFrom:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
    currency:
      type: string
      enum:
        - VND
    unit:
      type: string
      enum:
        - DECIMAL_MONTHLY_TOTAL_RETURN
    priceBasis:
      type: string
      enum:
        - NOMINAL
    cpiMeasure:
      type: string
      enum:
        - MONTH_ON_MONTH_CHANGE
    period: &a7
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
        to:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
      required:
        - from
        - to
    sources: &a10
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          title:
            type: string
            minLength: 3
            maxLength: 2000
          url:
            type: string
            format: uri
            maxLength: 2000
          retrievedOn:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          license:
            type: string
            minLength: 3
            maxLength: 2000
          usage:
            type: string
            enum:
              - SIMULATION_AND_DERIVED_OUTPUTS_PERMITTED
          evidence:
            type: string
            minLength: 3
            maxLength: 2000
        required:
          - id
          - title
          - url
          - retrievedOn
          - license
          - usage
          - evidence
      minItems: 1
      maxItems: 30
    assets:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          assetClass:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          sourceId:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,39}$
          totalReturnEvidence:
            type: string
            minLength: 3
            maxLength: 2000
          fees:
            oneOf:
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - NET
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - treatment
                  - evidence
              - type: object
                additionalProperties: false
                properties:
                  treatment:
                    type: string
                    enum:
                      - GROSS
                  monthlyDrag:
                    type: string
                    maxLength: 30
                    pattern: ^-?(0|[1-9]\d*)(\.\d{1,16})?$
                  evidence:
                    type: string
                    minLength: 3
                    maxLength: 2000
                required:
                  - treatment
                  - monthlyDrag
                  - evidence
          taxTreatment:
            type: string
            minLength: 3
            maxLength: 2000
          priceSide:
            type: string
            enum: &a1
              - BUY
              - SELL
              - MID
          returnBasis:
            type: string
            enum: &a2
              - TOTAL_RETURN
              - PRICE_ONLY
              - INCOME_ONLY
          licenseStatus:
            type: string
            enum: &a3
              - VERIFIED
              - UNVERIFIED
        required:
          - assetClass
          - sourceId
          - totalReturnEvidence
          - fees
          - taxTreatment
          - returnBasis
          - licenseStatus
      minItems: 1
      maxItems: 20
    cpiSourceId:
      type: string
      pattern: ^[A-Z][A-Z0-9_]{0,39}$
    quality:
      type: object
      additionalProperties: false
      properties:
        missingValues:
          type: string
          enum:
            - REJECT
        imputation:
          type: string
          enum:
            - NONE
        reviewNote:
          type: string
          minLength: 3
          maxLength: 2000
      required:
        - missingValues
        - imputation
        - reviewNote
    rows:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          month:
            type: string
            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
          returns:
            type: object
            additionalProperties:
              type: string
              maxLength: 30
              pattern: ^-?(0|[1-9]\d*)(\.\d{1,16})?$
          cpi:
            type: string
            maxLength: 30
            pattern: ^-?(0|[1-9]\d*)(\.\d{1,16})?$
        required:
          - month
          - returns
          - cpi
      minItems: 12
      maxItems: 2400
  required:
    - schemaVersion
    - title
    - reason
    - effectiveFrom
    - currency
    - unit
    - priceBasis
    - cpiMeasure
    - period
    - sources
    - assets
    - cpiSourceId
    - quality
    - rows
  description: ADMIN-owned real monthly total returns, VND nominal decimal
    fractions including dividends/distributions and CPI month-on-month. No
    missing, duplicate or discontinuous months; exact asset columns; no
    imputation. GROSS subtracts the explicitly approved monthlyDrag in decimal
    points once; NET is not deducted again. Each source must have licensed
    simulation/derived-output rights. Approval requires historical closed months
    and nonfuture retrieval dates. No synthetic production fallback.
