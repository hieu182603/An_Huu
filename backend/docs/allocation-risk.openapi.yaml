  description: Informational decision data; record=true explicitly saves an
    owner-scoped proposal without executing trades. Drift is checked at or above
    the policy band after allocating new contributions and maturities. From
    retirement, a shortfall against the approved minimum safe spending-floor
    fraction overrides this band (SPENDING_FLOOR_BREACHED). Cash-only
    allocations can be PROPOSED with BELOW_BAND and zero trading costs;
    maturedAmount is already included in holding value. Cost is half remaining
    gross buys+sells times approved turnover cost. Net targets solve the cost
    budget. WITHIN_BAND means no free cash and no remaining trigger. Product
    purchase orders combine cashAllocated and residual buy exactly once.
