      type: array
      items:
        $ref: "#/Scenario"
    longevity:
      $ref: "#/Longevity"
    limitations:
      type: array
      items: *a2
    selectedId: *a21
    threshold: *a2
    candidates:
      type: array
      items:
        $ref: "#/Candidate"
    rejected:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id: *a2
          issues:
            type: array
            items: *a2
        required:
          - id
          - issues
    adjustmentOptions:
      anyOf:
        - $ref: ./retirement.openapi.yaml#/AdjustmentOptions
        - type: object
          additionalProperties: false
          properties:
            status:
              type: string
              enum:
                - REVIEW_REQUIRED
            issues:
              type: array
              items: *a2
          required:
            - status
            - issues
    adjustmentKinds:
      type: array
      items: *a2
    rule: *a2
  required:
    - status
  description: pEssential is the fraction of COMPLETE paths funding every
    essential expense, not terminal solvency. CVaR = min eta [eta +
    mean((loss-eta)+)/(1-alpha)], loss is the sum of essential deficits at
    opening-month CPI prices. Wilson confidence=95% measures Monte Carlo
    sampling error only. Bands are funded balances in today's VND, rounded to
    millions; display probabilities to whole percentage points. Candidate
    comparison uses raw values, common seed, probability threshold then minimum
    CVaR then minimum equity shift. No Sharpe criterion. Missing data =>
    DATA_REQUIRED; missing approved parameters/classification =>
    REVIEW_REQUIRED; timeout/operation caps => LIMIT_EXCEEDED without partial
    statistics. Deterministic scenarios have individual statuses; longevity is
    the eighth kind. No writes or trades.
