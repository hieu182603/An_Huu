    assumptionVersion: *a1
    assumptionHash: *a2
    informationalOnly: *a15
    persisted: *a15
    modelCode: *a16
    seed: *a1
    paths: *a1
    blockMonths: *a1
    pEssential: *a5
    wilson: *a17
    cvarAlpha: *a2
    cvarEssentialShortfallToday: *a2
    display: *a18
    bands: *a19
    disclosure: *a20
    basis: *a2
    sources:
      type: array
      items:
        $ref: ./assumptions.openapi.yaml#/Source
