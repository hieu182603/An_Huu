  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - REVIEW_REQUIRED
        - WITHIN_BAND
        - PROPOSED
    issues:
      type: array
      items: *a2
    policyVersionId: *a3
    policyHash: *a2
    month: *a2
    persisted: *a15
    informationalOnly: *a15
    oldWeights:
      type: array
      items:
        $ref: "#/Allocation"
    targetWeights:
      type: array
      items:
        $ref: "#/Allocation"
    newWeights:
      type: array
      items:
        $ref: "#/Allocation"
    reason: *a2
    bandPoints: *a2
    costPercent: *a2
    cost: *a2
    netValue: *a2
    cashUsedBeforeTrades: *a2
    unallocatedNewContribution: *a2
    assumptions:
      type: array
      items: *a2
    trades:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          assetClass: *a2
          oldValue: *a2
          maturedAmount: *a2
          cashAllocated: *a2
          buy: *a2
          sell: *a2
          newValue: *a2
        required:
          - assetClass
          - oldValue
          - maturedAmount
          - cashAllocated
          - buy
          - sell
          - newValue
  required:
    - status
    - issues
  description: Decision data only; no persistence. Drift must be strictly greater
    than policy band. New contributions and maturities allocated before trades;
    maturedAmount is already included in holding value. Cost is half remaining
    gross buys+sells times approved turnover cost. Net targets solve the cost
    budget. WITHIN_BAND does not invest the new contribution. Existing actuals
    are not modified.
