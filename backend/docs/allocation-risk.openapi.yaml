  description: Historical stored market documents may omit return basis, license
    status or gold quote side. Reading preserves the original document hash;
    simulation discloses the missing verification. New publication requires
    total returns, verified licenses and BUY-side gold, or an explicit reasoned
    override stored in reviewNote.
MarketApprove:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    confirm:
      type: boolean
      enum:
        - true
    reviewNote:
      type: string
      minLength: 3
      maxLength: 2000
  required:
    - expectedRevision
    - confirm
    - reviewNote
MarketPublish:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    confirm:
      type: boolean
      enum:
        - true
    override:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required:
        - reason
  required:
    - expectedRevision
    - confirm
RiskInput:
  type: object
  additionalProperties: false
  properties:
    plan:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - PREVIEW
            preview:
              type: object
              additionalProperties: false
              properties:
                expectedProfileRevision:
                  type: integer
                  minimum: 1
                policyVersionId:
                  type: string
                  format: uuid
                scenario:
                  type: string
                  enum:
                    - BASE
                    - ADVERSE
                    - FAVORABLE
                templateId:
                  type: string
                  minLength: 1
                  maxLength: 100
                planningReaction:
                  type: string
                  enum:
                    - SELL
                    - HOLD
                    - BUY_MORE
                customAllocation:
                  anyOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        model:
                          type: string
                          enum:
                            - custom-glide-v1
                        weights:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              assetClass:
                                type: string
                                pattern: ^[A-Z][A-Z0-9_]{0,39}$
                              weightPercent:
                                type: string
                                maxLength: 20
                                pattern: ^(0|[1-9]\d?|100)(\.\d{1,8})?$
                            required:
                              - assetClass
                              - weightPercent
                          minItems: 1
                          maxItems: 20
                      required:
                        - model
                        - weights
                    - type: object
                      nullable: true
                      enum:
                        - null
                allocationFunding:
                  anyOf:
                    - type: string
                      enum:
                        - PROTECTED_CAPITAL_V1
                    - type: object
                      nullable: true
                      enum:
                        - null
                answers:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      questionId:
                        type: string
                        minLength: 1
                        maxLength: 100
                      choiceId:
                        type: string
                        minLength: 1
                        maxLength: 100
                    required:
                      - questionId
                      - choiceId
                  maxItems: 30
                liquidityNeedMonths:
                  type: integer
                  minimum: 0
                  maximum: 1200
                endMonth:
                  type: string
                  pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                monthlyExpenseToday:
                  type: string
                  pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                monthlyContribution:
                  type: string
                  pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                monthlyReserve:
                  type: string
                  pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                contributionTiming:
                  type: string
                  enum:
                    - END_OF_MONTH
                    - START_OF_MONTH
                  default: END_OF_MONTH
                surplusPolicy:
                  type: string
                  enum:
                    - EXPLICIT_DEPOSITS_ONLY
                  default: EXPLICIT_DEPOSITS_ONLY
                startOfMonthFunding:
                  type: object
                  additionalProperties: false
                  properties:
                    confirmed:
                      type: boolean
                      enum:
                        - true
                    source:
                      type: string
                      enum:
                        - CURRENT_MONTH_DISPOSABLE_CASH_AVAILABLE_AT_START
                    monthlyAvailable:
                      type: string
                      pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                    schedule:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          month:
                            type: string
                            pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                          amount:
                            type: string
                            pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                        required:
                          - month
                          - amount
                      maxItems: 1200
                      default: []
                  required:
                    - confirmed
                    - source
                    - monthlyAvailable
                terminalBalance:
                  type: string
                  pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                  default: "0"
                contributionSchedule:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      month:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      amount:
                        type: string
                        pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                    required:
                      - month
                      - amount
                  maxItems: 1200
                  default: []
                retirementContributionSchedule:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      month:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      amount:
                        type: string
                        pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                    required:
                      - month
                      - amount
                  maxItems: 1200
                  default: []
                retirementIncomeIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                  maxItems: 200
                retirementAdditionalExpenseIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                  maxItems: 200
                  default: []
                debtStress:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      loanId:
                        type: string
                        minLength: 1
                        maxLength: 100
                        pattern: ^[a-zA-Z0-9_-]+$
                      startMonth:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      endMonth:
                        type: string
                        pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      totalPaymentShare:
                        type: string
                        pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                    required:
                      - loanId
                      - startMonth
                      - endMonth
                      - totalPaymentShare
                  maxItems: 20
                  default: []
                whatIf:
                  type: object
                  additionalProperties: false
                  properties:
                    retirementMonth:
                      type: string
                      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                    assetValues:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          assetId:
                            type: string
                            minLength: 1
                            maxLength: 100
                          value:
                            type: string
                            pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                        required:
                          - assetId
                          - value
                      minItems: 1
                      maxItems: 200
                housing:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      assetId:
                        type: string
                        minLength: 1
                        maxLength: 100
                      amountScope:
                        type: string
                        enum:
                          - WHOLE_ASSET
                          - OWNERS_SHARE
                      linkedIncomeId:
                        type: string
                        minLength: 1
                        maxLength: 100
                    required:
                      - assetId
                      - amountScope
                  maxItems: 200
                  default: []
                advisoryFee:
                  type: object
                  additionalProperties: false
                  properties:
                    annualPercent:
                      type: string
                      pattern: ^-?(0|[1-9]\d{0,2})(\.\d{1,10})?$
                    paidFrom:
                      type: string
                      enum:
                        - FUND
                        - EXTERNAL
                  required:
                    - annualPercent
                    - paidFrom
              required:
                - expectedProfileRevision
                - policyVersionId
                - scenario
                - answers
                - liquidityNeedMonths
                - endMonth
                - monthlyExpenseToday
                - monthlyContribution
                - monthlyReserve
                - retirementIncomeIds
          required:
            - kind
            - preview
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - SAVED_VERSION
