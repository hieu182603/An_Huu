            properties:
              month: *a5
              returns:
                type: object
                additionalProperties: *a5
              cpi: *a5
            required:
              - month
              - returns
              - cpi
        preview:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              month: *a5
              returns:
                type: object
                additionalProperties:
                  type: string
                  nullable: true
              cpi:
                type: string
                nullable: true
              monthEndDates:
                type: object
                additionalProperties:
                  type: string
                  nullable: true
            required:
              - month
              - returns
              - cpi
              - monthEndDates
        issues:
          type: array
          items:
            $ref: "#/MarketDailyIssue"
        warnings:
          type: array
          items:
            $ref: "#/MarketDailyIssue"
      required:
        - status
        - assets
        - observationCount
        - period
        - rows
        - preview
        - issues
        - warnings
    meta:
      type: object
      additionalProperties: false
      properties:
        requestId: *a5
      required:
        - requestId
  required:
    - data
    - meta
  description: Monthly total return = month-end(m) / month-end(m-1) - 1, where
    month-end is the last observation within maxMonthEndGapDays of the calendar
    month end. Missing months are issues, never 0 or interpolation. `rows` is
    only filled when status is VALID and equals MarketDocument.rows. A trailing
    unfinished month, or up to 3 trailing months without published CPI, are left
    out with warnings.
