        - DATA_REQUIRED
        - REVIEW_REQUIRED
        - INSUFFICIENT
        - LIMIT_EXCEEDED
    issues:
      type: array
      items: *a2
    limits:
      $ref: "#/Limits"
    marketVersionId: *a3
    marketVersion: *a1
    marketHash: *a2
    inputHash: *a2
    profileHash: *a2
