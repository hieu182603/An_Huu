  required:
    - status
  description: pEssential is the fraction of COMPLETE paths funding every
    essential expense, not terminal solvency. CVaR = min eta [eta +
    mean((loss-eta)+)/(1-alpha)], loss is the sum of essential deficits at
    opening-month CPI prices. Wilson confidence=95% measures Monte Carlo
    sampling error only. Bands are funded balances in today's VND, rounded to
    millions; display probabilities to whole percentage points. Candidate
    comparison uses raw values, common seed, probability threshold then minimum
    CVaR then minimum equity shift. No Sharpe criterion. Simulation rebalances
    back to target when drift reaches or exceeds the approved policy band
    (allocationRisk.rebalanceBandPoints) when it is set. Selection puts a
    candidate outside the policy customization bounds in any month in rejected
    with issue WEIGHT_BOUND_EXCEEDED. Missing data => DATA_REQUIRED; missing
    approved parameters/classification => REVIEW_REQUIRED; timeout/operation
    caps => LIMIT_EXCEEDED without partial statistics. Deterministic scenarios
    have individual statuses; optional sequence stress uses configured annual
    returns. No writes or trades.
