            - null
    contentHash: *a3
    effectiveDate: *a5
    excerpt: *a3
Explanation:
  type: object
  additionalProperties: false
  required:
    - status
    - answer
    - facts
    - citations
    - provenance
    - knowledgeStatus
    - nextAction
    - applied
    - savedHistory
    - conversationId
    - revision
    - provider
  properties:
    status:
      type: string
      enum:
        - AI_ASSISTED
        - PROVIDER_NOT_CONFIGURED
        - PROVIDER_UNAVAILABLE
    answer: *a3
    facts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - key
          - text
        properties:
          key: *a3
          text: *a3
    citations:
      type: array
      items:
        $ref: "#/Citation"
    provenance:
      anyOf:
        - type: object
          additionalProperties: false
          required:
            - planId
            - versionId
            - snapshotHash
            - modelVersion
            - valuationDate
            - profileRevision
            - references
            - hypothetical
            - warningCodes
            - sources
            - valueKind
            - actuals
          properties:
            planId: *a4
            versionId: *a4
            snapshotHash: *a3
            modelVersion: *a3
            valuationDate: *a3
            profileRevision: *a1
            references:
              $ref: ./retirement.openapi.yaml#/Preview/properties/references
            hypothetical: *a2
            warningCodes:
              type: array
              items: *a3
            sources:
              $ref: ./retirement.openapi.yaml#/Preview/properties/sources
            valueKind: *a3
            actuals:
              anyOf:
                - type: object
                  additionalProperties: false
                  required:
                    - throughMonth
                    - status
                    - anchor
                    - issues
                    - revisions
                  properties:
                    throughMonth: *a3
                    status: *a3
                    anchor:
                      anyOf:
                        - type: object
                          additionalProperties: false
                          required:
                            - period
                            - revision
                            - closingBalance
                          properties:
                            period: *a3
                            revision: *a1
                            closingBalance: *a3
                        - type: object
                          nullable: true
                          enum:
                            - null
                    issues:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - month
                          - code
                        properties:
                          month: *a3
                          code: *a3
                    revisions:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - month
                          - revision
                        properties:
                          month: *a3
                          revision: *a1
                - type: object
                  nullable: true
                  enum:
                    - null
            sourceRegistry:
              type: object
              additionalProperties: false
              required:
                - registryHash
                - attribution
              properties:
                registryHash:
                  type: string
                attribution:
                  type: array
                  items:
                    $ref: ./source-snapshot.openapi.yaml#/Attribution
        - type: object
          nullable: true
          enum:
            - null
    knowledgeStatus: *a3
    nextAction: *a3
    applied:
      type: boolean
      enum:
        - false
    savedHistory: *a2
    conversationId:
      anyOf:
        - *a4
        - type: object
          nullable: true
          enum:
            - null
    revision:
      anyOf:
        - *a1
        - type: object
          nullable: true
          enum:
            - null
    provider:
      anyOf:
        - *a3
        - type: object
          nullable: true
          enum:
            - null
History:
  type: object
  additionalProperties: false
  required:
    - id
    - title
    - revision
    - expiresAt
    - messages
  properties:
    id: *a4
