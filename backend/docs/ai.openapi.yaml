ConsentInput:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 0
    policyVersion:
      type: string
      enum:
        - ai-explanation-gemini-2026-10-v2
    processing:
      type: boolean
    saveHistory:
      type: boolean
  required:
    - expectedRevision
    - policyVersion
    - processing
    - saveHistory
ExplanationInput:
  type: object
  additionalProperties: false
  properties:
    question:
      type: string
      minLength: 1
      maxLength: 2000
    planId:
      type: string
      format: uuid
    versionId:
      type: string
      format: uuid
    throughMonth:
      type: string
      pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
    conversationId:
      type: string
      format: uuid
    expectedRevision:
      type: integer
      minimum: 0
  required:
    - question
SimulationInput:
  type: object
  additionalProperties: false
  properties:
    planId:
      type: string
      format: uuid
    versionId:
      type: string
      format: uuid
    expectedProfileRevision:
      type: integer
      minimum: 1
    changes:
      type: object
      additionalProperties: false
      properties:
        retirementMonth:
          type: string
          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
        monthlyContribution:
          type: string
          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
        monthlyExpenseToday:
          type: string
          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
  required:
    - planId
    - versionId
    - expectedProfileRevision
    - changes
TitleInput:
  type: object
