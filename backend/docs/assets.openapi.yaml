AssetReport:
  type: object
  additionalProperties: false
  properties:
    profileRevision:
      type: integer
      minimum: 1
    valuationDate:
      type: string
    currency:
      type: string
      enum:
        - VND
    assetState:
      type: string
      enum:
        - KNOWN
        - UNKNOWN
        - NOT_APPLICABLE
    coverageBasis:
      type: string
      enum:
        - KNOWN
        - UNKNOWN
        - NO_EXPENSE
    totals:
      type: object
      additionalProperties: false
      properties:
        declaredValue:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        ownedValue:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        retirementLiquidAssets:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        emergencyReserve:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        housingOwnedValue:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        otherOwnedValue:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        monthlyExpense:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        totalDebt:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        netWorth:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        reserveCoverageMonths:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        debtToAssetsPercent:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
      required:
        - declaredValue
        - ownedValue
        - retirementLiquidAssets
        - emergencyReserve
        - housingOwnedValue
        - otherOwnedValue
        - monthlyExpense
        - totalDebt
        - netWorth
        - reserveCoverageMonths
        - debtToAssetsPercent
    percentages:
      type: object
      additionalProperties: false
      properties:
        retirementLiquidAssets:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        emergencyReserve:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        housingOwnedValue:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
        otherOwnedValue:
          anyOf:
            - type: string
              pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            - type: object
              nullable: true
              enum:
                - null
      required:
        - retirementLiquidAssets
        - emergencyReserve
        - housingOwnedValue
        - otherOwnedValue
    entries:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
          declaredValue:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          ownedValue:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          retirementLiquidAssets:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          emergencyReserve:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          housingOwnedValue:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
          otherOwnedValue:
            anyOf:
              - type: string
                pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
              - type: object
                nullable: true
                enum:
                  - null
        required:
          - id
          - declaredValue
          - ownedValue
          - retirementLiquidAssets
          - emergencyReserve
          - housingOwnedValue
          - otherOwnedValue
    issues:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          path:
            type: string
          code:
            type: string
        required:
          - path
          - code
  required:
    - profileRevision
    - valuationDate
    - currency
    - assetState
    - coverageBasis
    - totals
    - percentages
    - entries
    - issues
AssetReportEnvelope:
  type: object
  additionalProperties: false
  required:
    - data
    - meta
  properties:
    data:
      $ref: "#/AssetReport"
    meta:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
