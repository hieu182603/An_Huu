                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
