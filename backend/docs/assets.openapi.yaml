AssetPatch:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    command:
      anyOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - ADD
                - UPDATE
            entry:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
                type:
                  type: string
                  enum: &a1
                    - CASH
                    - DEPOSIT
                    - STOCK_FUND
                    - PRIMARY_HOME
                    - REAL_ESTATE
                    - OTHER
                    - GOLD
                    - BOND
                value:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  default: VND
                valuedOn:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                ownershipShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                retirementShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                emergencyShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                otherGoalsShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                liquidity:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          enum: &a2
                            - LIQUID
                            - ILLIQUID
                            - LOCKED
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                availableFromMonth:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                housingPlan:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNCONFIRMED
                      required:
                        - status
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - CONFIRMED
                        kind:
                          type: string
                          enum: &a3
                            - SALE
                            - RENT
                        startMonth:
                          type: string
                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])$
                        netAmount:
                          oneOf:
                            - type: object
                              additionalProperties: false
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - KNOWN
                                value:
                                  type: string
                                  pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                              required:
                                - status
                                - value
                            - type: object
                              additionalProperties: false
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - UNKNOWN
                              required:
                                - status
                      required:
                        - status
                        - kind
                        - startMonth
                        - netAmount
                costBasis:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
              required:
                - id
                - label
                - type
                - value
                - valuedOn
                - ownershipShare
                - retirementShare
                - emergencyShare
                - otherGoalsShare
                - liquidity
                - availableFromMonth
            confirmUnknownGroup:
              type: boolean
          required:
            - kind
            - entry
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - SPLIT
            sourceId:
              type: string
              minLength: 1
              maxLength: 100
              pattern: ^[a-zA-Z0-9_-]+$
            entry:
