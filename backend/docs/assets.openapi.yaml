              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
                type:
                  type: string
                  enum: *a1
                value:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
