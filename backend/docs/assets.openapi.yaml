                        value:
                          type: string
                          pattern: ^(19|20|21)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                ownershipShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
                        - status
                retirementShare:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - KNOWN
                        value:
                          type: string
                          pattern: ^(0(\.\d{1,8})?|1(\.0{1,8})?)$
                      required:
                        - status
                        - value
                    - type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                            - UNKNOWN
                      required:
