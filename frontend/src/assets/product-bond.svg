<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bnd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="bnd-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="bnd-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bnd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" fill="url(#bnd-bg)"/>

  <!-- Guilloche / Security pattern lines -->
  <g opacity="0.1" stroke="#fbbf24" stroke-width="1" fill="none">
    <ellipse cx="200" cy="80" rx="190" ry="70"/>
    <ellipse cx="200" cy="80" rx="170" ry="60"/>
    <ellipse cx="200" cy="80" rx="150" ry="50"/>
    <ellipse cx="330" cy="80" rx="60" ry="60"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 28)">
    <rect width="90" height="24" rx="12" fill="url(#bnd-amber)" opacity="0.95"/>
    <text x="45" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" text-anchor="middle">TRÁI PHIẾU</text>
  </g>

  <!-- Main Illustration: Bond Certificate & Institutional Pillars -->
  <g transform="translate(210, 16)">
    <!-- Certificate Outer Frame -->
    <rect x="20" y="12" width="150" height="102" rx="10" fill="url(#bnd-card)" stroke="url(#bnd-gold)" stroke-width="1.5"/>
    
    <!-- Inner ornate border -->
    <rect x="25" y="17" width="140" height="92" rx="7" fill="#1c1917" stroke="#78350f" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Bond Header Typography Lines -->
    <rect x="42" y="28" width="80" height="6" rx="3" fill="url(#bnd-gold)"/>
    <rect x="52" y="38" width="60" height="3" rx="1.5" fill="#a8a29e" opacity="0.8"/>
    
    <!-- Institutional Pillars / Bank columns in certificate center -->
    <g transform="translate(45, 48)">
      <!-- Pediment -->
      <polygon points="35,0 0,10 70,10" fill="url(#bnd-gold)"/>
      <!-- Columns -->
      <rect x="6" y="12" width="6" height="26" rx="1" fill="#e7e5e4"/>
      <rect x="24" y="12" width="6" height="26" rx="1" fill="#e7e5e4"/>
      <rect x="42" y="12" width="6" height="26" rx="1" fill="#e7e5e4"/>
      <rect x="58" y="12" width="6" height="26" rx="1" fill="#e7e5e4"/>
      <!-- Base -->
      <rect x="0" y="38" width="70" height="4" rx="1" fill="url(#bnd-gold)"/>
    </g>

    <!-- Golden Wax Seal Bottom Right -->
    <g transform="translate(132, 72)">
      <!-- Ribbon Tails -->
      <polygon points="12,14 18,34 10,30 2,34" fill="#991b1b"/>
      <polygon points="18,14 24,34 16,30 8,34" fill="#dc2626"/>
      <!-- Wax Seal -->
      <circle cx="12" cy="12" r="16" fill="url(#bnd-gold)" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="12" fill="#d97706"/>
      <!-- Checkmark/Star in seal -->
      <path d="M 7 12 L 10 15 L 17 8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Coupon Badge Top Left of Certificate -->
    <g transform="translate(10, 80)">
      <rect width="44" height="18" rx="4" fill="#047857" stroke="#34d399" stroke-width="1"/>
      <text x="22" y="13" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" text-anchor="middle">COUPON</text>
    </g>
  </g>
</svg>

