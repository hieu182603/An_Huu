<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="inv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="inv-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="inv-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="inv-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="inv-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" fill="url(#inv-bg)"/>

  <!-- Grid mesh -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="160"/>
    <line x1="120" y1="0" x2="120" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="280" y1="0" x2="280" y2="160"/>
    <line x1="360" y1="0" x2="360" y2="160"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 28)">
    <rect width="90" height="24" rx="12" fill="url(#inv-purple)" opacity="0.95"/>
    <text x="45" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" text-anchor="middle">ĐẦU TƯ QUỸ</text>
  </g>

  <!-- Dynamic Market Candlestick & Area Chart Graphic -->
  <g transform="translate(200, 20)">
    <!-- Chart Background Glass Plate -->
    <rect x="15" y="10" width="165" height="106" rx="14" fill="url(#inv-card)" stroke="#475569" stroke-width="1"/>

    <!-- Candlesticks -->
    <!-- Candle 1 -->
    <line x1="38" y1="62" x2="38" y2="94" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="33" y="68" width="10" height="18" rx="2" fill="#22c55e"/>

    <!-- Candle 2 -->
    <line x1="60" y1="52" x2="60" y2="88" stroke="#f87171" stroke-width="1.5"/>
    <rect x="55" y="60" width="10" height="20" rx="2" fill="#ef4444"/>

    <!-- Candle 3 -->
    <line x1="82" y1="40" x2="82" y2="76" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="77" y="46" width="10" height="22" rx="2" fill="#22c55e"/>

    <!-- Candle 4 -->
    <line x1="104" y1="28" x2="104" y2="66" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="99" y="34" width="10" height="24" rx="2" fill="#22c55e"/>

    <!-- Upward Trend Line with Gradient Pulse -->
    <path d="M 28 88 Q 60 74 85 55 T 150 25" fill="none" stroke="url(#inv-cyan)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Shaded area under trend -->
    <path d="M 28 88 Q 60 74 85 55 T 150 25 L 150 105 L 28 105 Z" fill="url(#inv-cyan)" opacity="0.12"/>

    <!-- Glowing peak dot -->
    <circle cx="150" cy="25" r="7" fill="#38bdf8" opacity="0.3"/>
    <circle cx="150" cy="25" r="4.5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

    <!-- Growth indicator badge -->
    <g transform="translate(112, 8)">
      <rect width="48" height="20" rx="10" fill="#15803d" stroke="#4ade80" stroke-width="1"/>
      <path d="M 120 18 L 123 14 L 126 18 Z" fill="#4ade80"/>
      <text x="136" y="22" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="9" font-weight="700">+18%</text>
    </g>

    <!-- Mini pie chart accent left bottom -->
    <g transform="translate(18, 92)">
      <circle cx="12" cy="12" r="10" fill="#3b82f6"/>
      <path d="M 12 12 L 12 2 A 10 10 0 0 1 22 12 Z" fill="#4ade80"/>
      <path d="M 12 12 L 22 12 A 10 10 0 0 1 15 21 Z" fill="#f59e0b"/>
    </g>
  </g>
</svg>

