<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4f8c"/>
      <stop offset="50%" stop-color="#052659"/>
      <stop offset="100%" stop-color="#02142d"/>
    </linearGradient>
    <linearGradient id="dep-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dep-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dep-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="dep-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" fill="url(#dep-bg)"/>

  <!-- Decorative Pattern Elements -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="340" cy="80" r="110"/>
    <circle cx="340" cy="80" r="80"/>
    <circle cx="340" cy="80" r="50"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
  </g>

  <!-- Left Accent Graphics: Yield badge & sparkles -->
  <g transform="translate(24, 28)">
    <rect width="76" height="24" rx="12" fill="url(#dep-mint)" opacity="0.9"/>
    <text x="38" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIỀN GỬI</text>

    <!-- Interest rate trend wave -->
    <path d="M 0 85 Q 35 60 70 75 T 140 50" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 0 85 Q 35 60 70 75 T 140 50 L 140 105 L 0 105 Z" fill="url(#dep-card)" opacity="0.3"/>
    <circle cx="140" cy="50" r="4" fill="#60a5fa"/>
    <circle cx="70" cy="75" r="3" fill="#93c5fd"/>
  </g>

  <!-- Main Illustration: Vault / Safe & Gold Stacks -->
  <g transform="translate(230, 18)">
    <!-- Glow behind vault -->
    <circle cx="85" cy="62" r="50" fill="#3b82f6" opacity="0.25" filter="url(#dep-glow)"/>

    <!-- Vault Base Frame -->
    <rect x="35" y="15" width="100" height="96" rx="16" fill="url(#dep-card)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="42" y="22" width="86" height="82" rx="12" fill="#0f2b48" stroke="#1e4976" stroke-width="1"/>

    <!-- Vault Door Wheel -->
    <circle cx="85" cy="63" r="28" fill="#143a60" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="85" cy="63" r="16" fill="url(#dep-gold)" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="85" cy="63" r="7" fill="#ffffff" opacity="0.9"/>

    <!-- Wheel Spokes -->
    <line x1="85" y1="39" x2="85" y2="47" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="85" y1="79" x2="85" y2="87" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="61" y1="63" x2="69" y2="63" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="101" y1="63" x2="109" y2="63" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gold Coins Stack Left -->
    <g transform="translate(8, 68)">
      <ellipse cx="18" cy="38" rx="16" ry="6" fill="#b45309"/>
      <ellipse cx="18" cy="34" rx="16" ry="6" fill="url(#dep-gold)"/>
      <ellipse cx="18" cy="27" rx="16" ry="6" fill="url(#dep-gold)"/>
      <ellipse cx="18" cy="20" rx="16" ry="6" fill="url(#dep-gold)"/>
      <ellipse cx="18" cy="13" rx="16" ry="6" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
      <!-- Sparkle -->
      <path d="M 28 6 L 30 11 L 35 13 L 30 15 L 28 20 L 26 15 L 21 13 L 26 11 Z" fill="#ffffff"/>
    </g>

    <!-- Key / Shield security emblem top right -->
    <g transform="translate(118, 12)">
      <circle cx="12" cy="12" r="14" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

