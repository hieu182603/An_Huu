<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ins-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ins-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ins-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ins-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ins-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" fill="url(#ins-bg)"/>

  <!-- Concentric protective ripple rings -->
  <g opacity="0.1" stroke="#2dd4bf" stroke-width="1.5" fill="none">
    <circle cx="280" cy="80" r="120"/>
    <circle cx="280" cy="80" r="90"/>
    <circle cx="280" cy="80" r="60"/>
    <circle cx="280" cy="80" r="30"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 28)">
    <rect width="90" height="24" rx="12" fill="url(#ins-teal)" opacity="0.95"/>
    <text x="45" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" text-anchor="middle">BẢO HIỂM</text>

    <!-- Health pulse line -->
    <path d="M 0 85 L 30 85 L 38 65 L 46 100 L 54 75 L 60 85 L 120 85" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Main Illustration: Protective Shield & Medical / Umbrella Motif -->
  <g transform="translate(220, 16)">
    <!-- Umbrella Canopy Silhouette Top -->
    <path d="M 30 52 C 30 20 120 20 120 52 C 105 48 95 52 85 48 C 75 52 65 48 55 52 C 45 48 35 52 30 52 Z" fill="#38bdf8" opacity="0.25"/>

    <!-- Central Shield of Protection -->
    <g transform="translate(32, 10)">
      <!-- Outer Shield Glow -->
      <path d="M 45 0 L 85 15 C 85 65 45 92 45 92 C 45 92 5 65 5 15 Z" fill="url(#ins-shield)" stroke="#2dd4bf" stroke-width="2"/>
      
      <!-- Inner Shield Line -->
      <path d="M 45 6 L 79 19 C 79 59 45 84 45 84 C 45 84 11 59 11 19 Z" fill="none" stroke="#5eead4" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

      <!-- Medical / Health Cross Symbol -->
      <g transform="translate(33, 30)">
        <rect x="9" y="0" width="7" height="26" rx="3" fill="#ffffff"/>
        <rect x="0" y="9.5" width="25" height="7" rx="3" fill="#ffffff"/>
      </g>
    </g>

    <!-- Family Protection Silhouette Circle Accent Left -->
    <g transform="translate(10, 68)">
      <circle cx="16" cy="16" r="16" fill="url(#ins-card)" stroke="#2dd4bf" stroke-width="1"/>
      <!-- Family icons: Adult & Child simple vector shapes -->
      <circle cx="12" cy="10" r="3.5" fill="#ffffff"/>
      <path d="M 6 22 C 6 17 18 17 18 22" fill="#ffffff"/>
      <circle cx="21" cy="13" r="2.5" fill="#5eead4"/>
      <path d="M 17 22 C 17 18 25 18 25 22" fill="#5eead4"/>
    </g>

    <!-- Protection Guarantee Seal Badge -->
    <g transform="translate(105, 78)">
      <circle cx="14" cy="14" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 9 14 L 13 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

