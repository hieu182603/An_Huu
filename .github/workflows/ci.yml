name: CI / Build & Typecheck

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Asset & Calculator Tests
        run: npm --prefix frontend run test:assets

      - name: TypeScript Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build Production Bundle
        run: npm --prefix frontend run build

      - name: Verify Build Output & SEO Prerenders
        run: |
          test -f frontend/dist/index.html || { echo "Build output missing frontend/dist/index.html"; exit 1; }
          node --test frontend/scripts/marketing-seo.test.mjs
          echo "Build artifact verified successfully!"

