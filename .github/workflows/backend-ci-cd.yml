name: Backend CI / CD — Azure Deployment
on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci-cd.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci-cd.yml"]
  workflow_dispatch:
    inputs:
      run_database_checks:
        description: Run migrations/integration on an isolated PostgreSQL service
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/anhuu_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm exec -- prisma validate
      - run: npm run prisma:generate
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm prune --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: backend-production
          include-hidden-files: true
          path: |
            backend/dist
            backend/node_modules
            backend/package.json
            backend/package-lock.json
            backend/prisma
  database-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_database_checks
    needs: validate-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/anhuu_ci_test
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/anhuu_ci_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: anhuu_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:test:prepare
      - run: npm run test:integration
  deploy-to-azure:
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-production
          path: backend
      - uses: azure/webapps-deploy@v3
        with:
          app-name: an-huu-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
